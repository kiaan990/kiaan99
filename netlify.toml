[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve the Aylin Awsners site at the root of the deployed domain.
# Keeps /aylin working as a canonical route and aliases "/" → "/aylin".
[[redirects]]
  from = "/"
  to = "/aylin"
  status = 200
  force = true
