D(`Transaction effects`, `A firm sells new shares of stock for cash. What happens to its debt ratio?`, `down`, `Assets (cash) rise, liabilities don't → total liabilities ÷ total assets falls.`),
]},
]});
/* ===================== UNIT 9 — RISK & RETURN (PREVIEW) ===================== */
U({id:9, name:`Risk & Return`, ch:`Foundations of Finance Ch. 6 · PREVIEW`, icon:`🎢`, color:`linear-gradient(135deg,#ff86d0,#d94fa8)`, preview:true,
desc:`Holding-period return, historical returns, expected return, coefficient of variation, beta + CAPM, diversification.`,
lessons:[
{name:`Learn`, items:[
C(`What is risk? What is return?`, `<p><b>Risk</b> = the chance of losing money = how much returns <b>vary</b>. More risk must come with more <b>expected</b> return.</p>
<div class="def"><b>Holding-period return (HPR)</b> = your total return over the time you held an investment.</div>
<div class="formula">HPR = (Ending Price − Beginning Price + Dividends/Interest) ÷ Beginning Price</div>
<p>Example: buy at $125.00, sell at $126.50, receive $2.33 in dividends → (126.50 − 125.00 + 2.33) ÷ 125.00 = 3.06%.</p>`),
N(`HPR & historical returns`, `You buy a stock at $125.00, sell it at $126.50, and receive $2.33 in dividends. What is your holding-period return (as a %)?`, 3.06, `%`, W([`HPR = (end − begin + dividends) ÷ begin`, `= (126.50 − 125.00 + 2.33) ÷ 125.00`, `= 3.83 ÷ 125.00 = 0.0306 = 3.06%`])),
N(`HPR & historical returns`, `Variation: buy at $50, sell at $55, receive $1 in dividends. What is the HPR (as a %)?`, 12, `%`, W([`HPR = (55 − 50 + 1) ÷ 50`, `= 6 ÷ 50 = 0.12 = 12.00%`])),
M(`HPR & historical returns`, `In this course, risk is best described as…`, [`The variability of returns (the chance of losing money)`, `A guaranteed loss`, `The interest rate on T-bills`, `The price of a stock`], `Risk = chance of losing money = how much returns bounce around.`),
C(`History: 1926–2023 (98 years)`, `<table class="t"><tr><th>Asset</th><th>Avg return</th></tr><tr><td>Small-company stocks</td><td>11.7% (most volatile: SD 31.5%)</td></tr><tr><td>Large-company stocks</td><td>10.3% (SD 19.7%)</td></tr><tr><td>Long-term corporate bonds</td><td>6.0%</td></tr><tr><td>T-bills</td><td>3.3% (SD 3.1%)</td></tr><tr><td>Inflation</td><td>2.9%</td></tr></table>
<div class="def"><b>Historical average return</b> = average of the yearly HPRs. <b>Standard deviation (SD)</b> = how much returns bounce around the average (volatility). <b>T-bills</b> ≈ risk-free. <b>Risk premium</b> = return above T-bills.</div>
<p>2008 crash: a 6.7-SD drop. Normal-distribution math says that happens once every 1.2 billion years — it happened in a lifetime. Risk models understate <b>fat tails</b> (extreme events).</p>`),
M(`HPR & historical returns`, `From 1926–2023, which asset had the highest average return AND the highest volatility?`, [`Small-company stocks (11.7%, SD 31.5%)`, `Large-company stocks`, `T-bills`, `Long-term corporate bonds`], `Small stocks: highest average (11.7%) and most volatile (SD 31.5%). Risk and reward go together.`),
N(`HPR & historical returns`, `Large-company stocks averaged 10.3%; T-bills averaged 3.3%. What is the risk premium on large stocks (as a %)?`, 7, `%`, W([`Risk premium = return − T-bill return`, `= 10.3% − 3.3% = 7.00%`])),
M(`HPR & historical returns`, `Which asset is treated as (nearly) risk-free?`, [`T-bills`, `Small-company stocks`, `Junk bonds`, `Large-company stocks`], `T-bills: about 3.3% average with very low volatility (SD 3.1%).`),
M(`HPR & historical returns`, `A higher standard deviation of returns means…`, [`The investment is more volatile`, `The investment is safer`, `The average return is lower`, `The investment pays dividends`], `SD measures how much returns bounce around the average. Higher SD = more volatile.`),
M(`HPR & historical returns`, `The 2008 crash was a 6.7-standard-deviation event — "once every 1.2 billion years" by normal-distribution math. The lesson?`, [`Risk models understate fat tails — extreme events happen more than models say`, `2008 never really happened`, `Stocks have no risk`, `Standard deviation is always exact`], `Real markets have "fat tails": extreme moves happen far more often than the normal curve predicts.`),
D(`HPR & historical returns`, `An investor moves from T-bills into small-company stocks. Based on 1926–2023 history, what happens to their expected return?`, `up`, `It rises (3.3% → 11.7% average) — but so does volatility (SD 3.1% → 31.5%). Risk requires a reward.`),
]},
{name:`Drill`, items:[
C(`Expected return`, `<div class="formula">Expected return = Σ (probability × return)</div>
<p>Multiply each possible outcome by its probability, then add them up.</p>
<p>Example: a $1,000 bond pays in 1 year: 10% chance $900, 80% chance $1,300, 10% chance $1,500. Expected cash flow = .10(900) + .80(1,300) + .10(1,500) = $1,280 → E(R) = (1,280 − 1,000) ÷ 1,000 = 28%.</p>
<p>⚠️ Calculating the <b>standard deviation of expected return</b> is NOT on Exam 2.</p>`),
N(`Expected return`, `A $1,000 investment pays in 1 year: 10% chance of $900, 80% chance of $1,300, 10% chance of $1,500. What is the EXPECTED cash flow?`, 1280, `$`, W([`E(CF) = Σ (probability × outcome)`, `= 0.10(900) + 0.80(1,300) + 0.10(1,500)`, `= 90 + 1,040 + 150 = $1,280.00`])),
N(`Expected return`, `You pay $1,000 and expect $1,280 back in 1 year. What is the expected return (as a %)?`, 28, `%`, W([`E(R) = (1,280 − 1,000) ÷ 1,000`, `= 280 ÷ 1,000 = 0.28 = 28.00%`])),
N(`Expected return`, `A publishing stock will be worth $8 (40% chance) or $10 (60% chance) next year. What is its EXPECTED price?`, 9.20, `$`, W([`E(P) = 0.40(8) + 0.60(10)`, `= 3.20 + 6.00 = $9.20`])),
N(`Expected return`, `That stock costs $8.08 today and has an expected price of $9.20. What is the expected return (as a %)?`, 13.86, `%`, W([`E(R) = (9.20 − 8.08) ÷ 8.08`, `= 1.12 ÷ 8.08 = 0.1386 = 13.86% (≈ 14%)`])),
N(`Expected return`, `Variation: an investment returns 10% (50% chance) or 20% (50% chance). What is the expected return (as a %)?`, 15, `%`, W([`E(R) = 0.50(10%) + 0.50(20%)`, `= 5% + 10% = 15.00%`])),
C(`Coefficient of variation (CV)`, `<div class="formula">CV = Standard Deviation ÷ Expected Return</div>
<p>CV = risk <b>per unit</b> of return. Lower CV = less risk for each 1% of return you expect.</p>`),
N(`Coefficient of variation`, `Investment A has SD 20% and expected return 10%. What is its CV?`, 2.0, ``, W([`CV = SD ÷ E(R)`, `= 20% ÷ 10% = 2.00`])),
N(`Coefficient of variation`, `Investment B has SD 15% and expected return 8%. What is its CV?`, 1.88, ``, W([`CV = 15% ÷ 8% = 1.875 ≈ 1.88`])),
M(`Coefficient of variation`, `A: CV 2.0 (SD 20%, E(R) 10%). B: CV 1.88 (SD 15%, E(R) 8%). Which has LESS risk per unit of return?`, [`B — lower CV`, `A — higher expected return`, `A — higher CV`, `They're the same`], `Lower CV = less risk per unit of return → B.`),
T(`Expected return`, `Expected return = Σ (probability × ________).`, [`return`, `returns`, `outcome`], `Expected return = Σ (probability × <b>return</b>).`),
]},
{name:`Master`, items:[
C(`Beta, diversification and CAPM`, `<div class="def"><b>Beta</b> = how sensitive a stock is to the overall market. The market's beta = <b>1.0</b>. Beta 1.5 moves ~1.5× the market, both up and down.</div>
<ul><li><b>Defensive</b> industries (food, tobacco): beta &lt; 1. <b>Cyclical</b> (autos, airlines): beta &gt; 1.</li>
<li><b>Systematic risk</b> = market-wide (interest rates, recessions). Can't be diversified away. Measured by <b>beta</b>.</li>
<li><b>Unsystematic risk</b> = firm-specific (a CEO scandal). Diversifiable with <b>30+ stocks</b>.</li></ul>
<div class="formula">CAPM: Expected return = Risk-free rate + Beta × (Market return − Risk-free rate)</div>
<p><b>Efficient frontier</b> = portfolios giving the most return for a given risk; rational investors hold portfolios ON it.</p>
<p>Beta ≠ volatility: a stock can be very volatile (high SD) but have a low beta if its moves are unrelated to the market.</p>`),
M(`Beta & CAPM`, `What is the beta of the overall market?`, [`1.0`, `0`, `0.5`, `2.0`], `The market's beta is 1.0 by definition.`),
M(`Beta & CAPM`, `Which industry would likely have a beta LESS than 1?`, [`Food (defensive)`, `Airlines (cyclical)`, `Autos (cyclical)`, `Luxury travel`], `Defensive industries like food and tobacco move less than the market.`),
N(`Beta & CAPM`, `A stock has a beta of 1.5. The market rises 10%. Roughly how much should the stock rise (as a %)?`, 15, `%`, W([`Stock move ≈ beta × market move`, `= 1.5 × 10% = 15.00%`, `(It would also fall ~15% if the market fell 10%.)`])),
N(`Beta & CAPM`, `CAPM: risk-free rate 3.3%, market return 10.3%, beta 1.5. What is the expected return (as a %)?`, 13.8, `%`, W([`E(R) = Rf + β × (Rm − Rf)`, `= 3.3% + 1.5 × (10.3% − 3.3%)`, `= 3.3% + 1.5 × 7.0%`, `= 3.3% + 10.5% = 13.80%`])),
N(`Beta & CAPM`, `CAPM: risk-free rate 3.3%, market return 10.3%, beta 1.0. What is the expected return (as a %)?`, 10.3, `%`, W([`E(R) = 3.3% + 1.0 × (10.3% − 3.3%)`, `= 3.3% + 7.0% = 10.30% — exactly the market return, since beta = 1`])),
D(`Beta & CAPM`, `A stock's beta rises from 0.8 to 1.4 (everything else the same). What happens to its CAPM expected return?`, `up`, `Higher beta → more systematic risk → higher required/expected return.`),
M(`Diversification`, `A CEO scandal hits one company's stock. What type of risk is this?`, [`Unsystematic (firm-specific) — diversifiable`, `Systematic — can't be diversified`, `Market risk measured by beta`, `Interest-rate risk`], `Firm-specific events are unsystematic risk. Holding 30+ stocks diversifies it away.`),
M(`Diversification`, `Which risk can NOT be diversified away?`, [`Systematic risk (recessions, interest rates)`, `A product recall at one firm`, `A CEO scandal`, `One factory's fire`], `Systematic (market-wide) risk stays no matter how many stocks you hold. It's measured by beta.`),
D(`Diversification`, `You go from owning 2 stocks to owning 40 stocks across industries. What happens to your UNSYSTEMATIC risk?`, `down`, `Diversification kills unsystematic risk — that's what 30+ stocks does. Systematic risk remains.`),
M(`Beta & CAPM`, `A stock is very volatile (high SD), but its ups and downs are unrelated to the market. What could its beta be?`, [`Low — beta measures market sensitivity, not total volatility`, `Must be above 2.0`, `Exactly 1.0`, `Beta can't be measured`], `Beta ≠ volatility. Beta only captures how the stock moves WITH the market.`),
M(`Beta & CAPM`, `What is the efficient frontier?`, [`The set of portfolios with the most return for each level of risk`, `The riskiest possible portfolio`, `A list of T-bill rates`, `The highest-beta stocks`], `Rational investors hold portfolios ON the efficient frontier.`),
]},
]});

/* ===================== UNIT 10 — BONDS (PREVIEW) ===================== */
U({id:10, name:`Bonds`, ch:`Foundations of Finance Ch. 7 · PREVIEW`, icon:`📜`, color:`linear-gradient(135deg,#6c63ff,#4b44c9)`, preview:true,
desc:`Bond vocabulary, pricing (Bonds A/B/C), premium vs discount, zero-coupon bonds, interest-rate risk, bond types and Treasuries.`,
lessons:[
{name:`Learn`, items:[
C(`What is a bond?`, `<p>A <b>bond</b> = a loan YOU make to a company or government. You get fixed <b>coupon</b> payments (usually semiannual) plus the <b>par value</b> back at <b>maturity</b>.</p>
<div class="def"><b>Par value</b> (face value) = the amount repaid at maturity, usually $1,000. <b>Coupon rate</b> = the yearly interest rate on par. <b>Maturity</b>: short &lt; 5 years, intermediate 5–10, long &gt; 10.</div>
<div class="formula">Coupon payment = coupon rate × par (per payment period)</div>
<p><b>Bond prices move OPPOSITE to interest rates</b>: rates up → prices down.</p>
<p>Vocabulary: <b>indenture</b> = the legal contract; <b>covenants</b> = restrictions on the issuer; <b>trustee</b> = represents bondholders; <b>collateral</b> vs unsecured <b>debentures</b>; <b>subordinated</b> debt = paid after senior debt.</p>`),
M(`Bond basics`, `When you buy a bond, you are…`, [`Lending money to the issuer`, `Buying ownership in the company`, `Getting a credit card`, `Buying insurance`], `A bond is a loan you make to a company or government.`),
D(`Bond basics`, `Market interest rates RISE. What happens to the prices of existing bonds?`, `down`, `Prices move opposite to rates. Older bonds paying lower coupons become less attractive, so their price falls.`),
N(`Bond basics`, `A bond has a $1,000 par value and an 8% coupon, paid ANNUALLY. What is the coupon payment?`, 80, `$`, W([`Coupon = coupon rate × par`, `= 0.08 × 1,000 = $80.00 per year`])),
N(`Bond basics`, `A $1,000 par bond has a 10% coupon paid SEMIANNUALLY. How much is each coupon payment?`, 50, `$`, W([`Annual coupon = 0.10 × 1,000 = 100`, `Per payment period (half-year) = 100 ÷ 2 = $50.00`])),
M(`Bond features`, `The legal contract between the bond issuer and bondholders is the…`, [`Indenture`, `Debenture`, `Covenant`, `Coupon`], `Indenture = the legal contract. Covenants are restrictions written into it.`),
M(`Bond features`, `An unsecured bond (no collateral) is called a…`, [`Debenture`, `Mortgage bond`, `T-bill`, `Sinking fund`], `Debentures are unsecured.`),
M(`Bond features`, `Who represents the bondholders' interests?`, [`The trustee`, `The CEO`, `The underwriter's customers`, `The IRS`], `The trustee represents bondholders.`),
M(`Bond features`, `Subordinated debt is…`, [`Paid after senior debt if the firm fails`, `Paid before all other debt`, `Not real debt`, `Guaranteed by the government`], `Subordinated = lower priority, paid after senior debt.`),
M(`Bond basics`, `A bond maturing in 7 years is considered…`, [`Intermediate-term (5–10 years)`, `Short-term (under 5 years)`, `Long-term (over 10 years)`, `A T-bill`], `Short < 5, intermediate 5–10, long > 10 years.`),
]},
{name:`Drill`, items:[
C(`Pricing a bond`, `<div class="formula">Bond value = PV of coupons (annuity) + PV of par (single sum)</div>
<p>Slide example: 3-year bonds, <b>ANNUAL</b> coupons, market rate <b>8%</b> for all three. PV of par = 1,000 ÷ 1.08³ = $793.83.</p>
<table class="t"><tr><th>Bond</th><th>Coupon</th><th>PV coupons</th><th>Price</th></tr><tr><td>A</td><td>8% ($80)</td><td>$206.17</td><td>$1,000.00 (par)</td></tr><tr><td>B</td><td>7% ($70)</td><td>$180.40</td><td>$974.23 (discount)</td></tr><tr><td>C</td><td>9% ($90)</td><td>$231.94</td><td>$1,025.77 (premium)</td></tr></table>
<ul><li>Market rate = coupon → <b>par</b>. Market ABOVE coupon → <b>discount</b>. Market BELOW coupon → <b>premium</b>.</li></ul>
<div class="def"><b>Current yield</b> = annual coupon ÷ price. <b>Yield to maturity (YTM)</b> = your return if you hold to maturity — know the MEANING only; the YTM calculation is NOT on Exam 2.</div>
<p>Excel: =PV(rate, nper, pmt, fv) with rate and periods matched to the payment frequency.</p>`),
N(`Bond pricing`, `A $1,000 par bond matures in 3 years. The market rate is 8%. What is the PV of the par value?`, 793.83, `$`, W([`PV = 1,000 ÷ (1.08)^3`, `(1.08)^3 = 1.259712`, `PV = 1,000 ÷ 1.259712 = $793.83`])),
N(`Bond pricing`, `Bond A pays $80 annual coupons for 3 years. Market rate 8%. What is the PV of the coupons?`, 206.17, `$`, W([`PV annuity = 80 × [(1 − (1.08)^−3) ÷ 0.08]`, `(1.08)^−3 = 0.793832`, `(1 − 0.793832) ÷ 0.08 = 2.577097`, `PV = 80 × 2.577097 = $206.17`])),
N(`Bond pricing`, `Bond B: 7% annual coupon ($70), 3 years, $1,000 par, market rate 8%. PV of coupons = $180.40. What is the bond's price?`, 974.23, `$`, W([`PV of par = 1,000 ÷ 1.08^3 = 793.83`, `Price = PV coupons + PV par`, `= 180.40 + 793.83 = $974.23 (a discount)`])),
N(`Bond pricing`, `Bond C: 9% annual coupon ($90), 3 years, $1,000 par, market rate 8%. What is the price?`, 1025.77, `$`, W([`PV coupons = 90 × 2.577097 = 231.94`, `PV par = 1,000 ÷ 1.08^3 = 793.83`, `Price = 231.94 + 793.83 = $1,025.77 (a premium)`])),
M(`Premium vs discount`, `A bond's coupon rate EQUALS the market rate. It sells at…`, [`Par ($1,000)`, `A premium`, `A discount`, `Zero`], `Coupon = market rate → price = par.`),
M(`Premium vs discount`, `A bond has a 6% coupon, but the market rate is 8%. It sells at…`, [`A discount (below par)`, `A premium (above par)`, `Exactly par`, `It can't be sold`], `Market rate ABOVE coupon → nobody pays full price for a below-market coupon → discount.`),
M(`Premium vs discount`, `A bond has a 9% coupon and the market rate is 8%. It sells at…`, [`A premium (above par)`, `A discount`, `Par`, `Half of par`], `Market rate BELOW coupon → the coupon is better than the market → buyers pay more → premium.`),
N(`Bond pricing`, `Bond C pays a $90 annual coupon and its price is $1,025.77. What is its current yield (as a %)?`, 8.77, `%`, W([`Current yield = annual coupon ÷ price`, `= 90 ÷ 1,025.77 = 0.0877 = 8.77%`])),
M(`Bond pricing`, `Bond B (price $974.23, 7% coupon, market 8%) earns 7.19% from income plus 0.81% from capital gain. What is its yield to maturity?`, [`8.00% — it equals the market rate`, `7.00% — the coupon rate`, `7.19% — the current yield`, `0.81%`], `7.19% + 0.81% = 8.00% = the market rate. (Remember: you only need to know what YTM MEANS, not calculate it.)`),
M(`Bond pricing`, `What does yield to maturity (YTM) mean?`, [`The return you earn if you hold the bond until it matures`, `The coupon rate`, `The bond's par value`, `The price of the bond today`], `YTM = return if held to maturity. Meaning only — calculation is not on Exam 2.`),
]},
{name:`Master`, items:[
C(`Zero-coupons, price paths and rate risk`, `<p><b>Zero-coupon bond</b>: no coupons — you buy at a deep discount and get par at maturity. You're taxed on "<b>phantom interest</b>" each year even though no cash arrives. <b>STRIPS</b> = a Treasury bond split into separate coupon and principal pieces.</p>
<p>As maturity approaches: <b>premium</b> prices fall toward par, <b>discount</b> prices rise toward par — both equal $1,000 at maturity.</p>
<p><b>Interest-rate risk</b>: LONGER maturity + LOWER coupon = bigger price swings when rates move. A 30-year bond swings far more than a 3-year bond.</p>`),
N(`Zero-coupon`, `A zero-coupon bond: $1,000 face, 5 years, 14% nominal rate compounded SEMIANNUALLY. What is its price?`, 508.35, `$`, W([`Rate per half-year = 14% ÷ 2 = 7%`, `Periods = 5 × 2 = 10`, `Price = 1,000 ÷ (1.07)^10`, `(1.07)^10 = 1.967151`, `= 1,000 ÷ 1.967151 = $508.35`])),
N(`Zero-coupon`, `You buy that zero-coupon bond for $508.35 and receive $1,000 at maturity. How much interest do you earn over its life?`, 491.65, `$`, W([`Interest = 1,000.00 − 508.35 = $491.65`])),
M(`Zero-coupon`, `Why is a zero-coupon bond taxed on "phantom interest"?`, [`You owe tax on interest each year even though no cash is paid until maturity`, `It pays no interest at all`, `The interest is tax-free`, `It's taxed only when sold`], `The bond's value grows each year (imputed interest), and that's taxable — even with no cash in hand.`),
D(`Premium vs discount`, `A bond selling at a DISCOUNT gets closer to maturity (rates unchanged). What happens to its price?`, `up`, `Discount prices rise toward par as maturity nears — at maturity it's worth exactly $1,000.`),
D(`Premium vs discount`, `A bond selling at a PREMIUM gets closer to maturity (rates unchanged). What happens to its price?`, `down`, `Premium prices fall toward par as maturity approaches.`),
M(`Interest-rate risk`, `Which bond's price swings MOST when interest rates change?`, [`30-year bond with a low coupon`, `3-year bond with a high coupon`, `A T-bill`, `3-year bond with a low coupon`], `Longer maturity + lower coupon = more interest-rate risk.`),
M(`Bond features`, `Why is a CALLABLE bond bad for the bondholder?`, [`The issuer can redeem it early when rates fall — right when you'd want to keep it`, `It can never be sold`, `It pays no coupons`, `It's always junk`], `Issuers call bonds when rates drop, so you lose your high coupon and must reinvest at lower rates.`),
M(`Bond features`, `Match: a bond the HOLDER can sell back to the issuer early is…`, [`Puttable`, `Callable`, `Convertible`, `Subordinated`], `Puttable = holder's option. Callable = issuer's option. Convertible = can be exchanged for stock.`),
M(`Bond features`, `A sinking fund is…`, [`Money set aside to retire bonds gradually`, `A fund for sunk costs`, `A type of junk bond`, `A tax on bonds`], `Sinking fund = money set aside over time to retire the bonds.`),
C(`Ratings and Treasuries`, `<ul><li><b>Junk bonds</b>: BB or lower (S&amp;P) / Ba or lower (Moody's) — high yield, high default risk. <b>Investment grade</b>: BBB / Baa and above.</li>
<li><b>T-bills</b>: up to 1 year, sold at a discount. <b>T-notes</b>: 2–10 years. <b>T-bonds</b>: 20–30 years.</li>
<li><b>I-bonds</b>: inflation-protected; rates adjust every 6 months. <b>TIPS</b>: principal adjusts with inflation.</li></ul>`),
M(`Ratings & Treasuries`, `An S&P rating of BB is…`, [`Junk (high yield, high default risk)`, `Investment grade`, `Risk-free`, `A Treasury rating`], `BB or lower (S&P) / Ba or lower (Moody's) = junk. BBB/Baa and above = investment grade.`),
M(`Ratings & Treasuries`, `Which Treasury matures in up to 1 year and is sold at a discount?`, [`T-bill`, `T-note`, `T-bond`, `TIPS`], `T-bills: up to 1 year, sold at a discount. T-notes 2–10 yrs. T-bonds 20–30 yrs.`),
M(`Ratings & Treasuries`, `Which Treasury security's PRINCIPAL adjusts with inflation?`, [`TIPS`, `T-bill`, `I-bond`, `STRIPS`], `TIPS: principal adjusts with inflation. I-bonds: the rate adjusts every 6 months.`),
]},
]});

/* ===================== UNIT 11 — STOCKS (PREVIEW) ===================== */
U({id:11, name:`Stocks`, ch:`Foundations of Finance Ch. 8 · PREVIEW`, icon:`📈`, color:`linear-gradient(135deg,#58cc02,#1cb0f6)`, preview:true,
desc:`Common vs preferred, preferred as a perpetuity, dividend discount model, dividend dates, shareholder rights, IPOs and exchanges.`,
lessons:[
{name:`Learn`, items:[
C(`Common vs preferred stock`, `<ul><li><b>Common stock</b> = ownership: <b>voting rights</b> + a <b>residual claim</b> (paid LAST, after everyone else).</li>
<li><b>Preferred stock</b> = a <b>fixed dividend</b>, usually <b>no vote</b>, paid <b>before</b> common.</li></ul>
<div class="def"><b>Dividend</b> = cash a company pays its shareholders. Dividends are decided by the <b>board</b> and are <b>NOT guaranteed</b>.</div>
<p><b>Stock price = present value of the future cash flows to the shareholder.</b></p>`),
M(`Common vs preferred`, `Which gives voting rights and a residual claim (paid last)?`, [`Common stock`, `Preferred stock`, `A bond`, `A T-bill`], `Common stock = ownership, voting, residual claim.`),
M(`Common vs preferred`, `Preferred stock typically has…`, [`A fixed dividend, no vote, paid before common`, `Voting rights and a variable dividend`, `A maturity date like a bond`, `A guaranteed dividend by law`], `Preferred: fixed dividend, usually no vote, paid ahead of common.`),
M(`Common vs preferred`, `Who decides whether a company pays a dividend?`, [`The board of directors — dividends are NOT guaranteed`, `The government`, `Each shareholder individually`, `The company's bank`], `The board declares dividends; they aren't guaranteed.`),
C(`Valuing preferred stock`, `<p>A preferred dividend is the same every year with no end date → it's a <b>perpetuity</b>.</p>
<div class="formula">Preferred value = D ÷ r</div>
<p>Morgan Stanley preferred: $1.72 dividend, 6.2% required return → $1.72 ÷ 0.062 = $27.74.</p>`),
N(`Preferred valuation`, `Morgan Stanley preferred pays $1.72 per year. Required return = 6.2%. What is it worth?`, 27.74, `$`, W([`Value = D ÷ r`, `= 1.72 ÷ 0.062 = $27.74`])),
N(`Preferred valuation`, `Sunshine Carpet Cleaners preferred pays $4.25 per year. Required return = 6.90%. What is it worth?`, 61.59, `$`, W([`Value = 4.25 ÷ 0.069 = $61.59`])),
N(`Preferred valuation`, `If the required return on Sunshine's $4.25 preferred rises to 7.9%, what is it worth now?`, 53.80, `$`, W([`Value = 4.25 ÷ 0.079 = $53.80`, `(Down from $61.59 — higher required return, lower price.)`])),
N(`Preferred valuation`, `Kreuger preferred pays $2.08 per year. Required return = 9.9%. What is it worth?`, 21.01, `$`, W([`Value = 2.08 ÷ 0.099 = $21.01`])),
D(`Preferred valuation`, `The required return on a preferred stock RISES. What happens to its value?`, `down`, `Value = D ÷ r. A bigger r means a smaller value.`),
C(`Preferred: a hybrid`, `<p><b>Like common stock</b>: no fixed maturity; missed dividends don't cause bankruptcy; dividends are not tax-deductible for the company.</p>
<p><b>Like a bond</b>: dividends fixed in amount, paid as a dollar amount or % of par.</p>
<p>Usually no voting rights; may be convertible or callable; usually <b>cumulative</b> dividends (missed ones must be paid before common gets anything). <b>Safer than common, riskier than bonds.</b> Market size: preferred ~$400B (2024) vs common ~$62.8T (July 2025).</p>`),
M(`Common vs preferred`, `In what way is preferred stock like a BOND?`, [`Its dividends are fixed in amount`, `It has a fixed maturity date`, `Missed dividends cause bankruptcy`, `Its dividends are tax-deductible`], `Preferred dividends are fixed, like bond coupons. But unlike bonds there's no maturity, and missing a dividend doesn't trigger bankruptcy.`),
M(`Common vs preferred`, `How does preferred stock's risk compare?`, [`Safer than common, riskier than bonds`, `Riskier than common`, `Safer than bonds`, `Risk-free`], `Preferred sits in the middle: paid before common, after bonds.`),
]},
{name:`Drill`, items:[
C(`The dividend discount model (DDM)`, `<p>For common stock with dividends growing at a constant rate <b>g</b> forever:</p>
<div class="formula">Value = D<sub>1</sub> ÷ (r − g)</div>
<div class="def"><b>D<sub>1</sub></b> = NEXT year's dividend. <b>r</b> = required return. <b>g</b> = constant growth rate.</div>
<p>Only works when <b>r &gt; g</b> and growth is truly constant. If g &gt; r you get a negative value — nonsense, the model is being misused. The model values the dividend stream, so it assumes the firm pays dividends.</p>
<p>⚠️ Solving for the expected return with the DDM is NOT on Exam 2.</p>`),
N(`DDM`, `Next year's dividend D1 = $1.04, required return 10%, growth 5%. What is the stock worth (DDM)?`, 20.80, `$`, W([`Value = D1 ÷ (r − g)`, `= 1.04 ÷ (0.10 − 0.05)`, `= 1.04 ÷ 0.05 = $20.80`])),
N(`DDM`, `Variation: D1 = $2.00, required return 12%, growth 4%. What is the stock worth?`, 25, `$`, W([`Value = 2.00 ÷ (0.12 − 0.04)`, `= 2.00 ÷ 0.08 = $25.00`])),
M(`DDM`, `What must be true to use the constant-growth DDM?`, [`r must be greater than g, and growth must be constant`, `g must be greater than r`, `The firm must pay no dividends`, `r must equal g`], `Requires r > g and truly constant growth.`),
M(`DDM`, `You plug in g = 12% and r = 9% and get a NEGATIVE stock value. What does that mean?`, [`The model is being misused — it only works when r > g`, `The stock is worth less than zero`, `You should short the stock`, `The company is bankrupt`], `A negative value is nonsense. The DDM breaks when g ≥ r.`),
D(`DDM`, `In the DDM, the expected growth rate g rises (r stays the same and still above g). What happens to the stock's value?`, `up`, `Value = D1 ÷ (r − g). Bigger g → smaller denominator → bigger value.`),
C(`Stock returns`, `<div class="formula">One-period return = (P<sub>1</sub> − P<sub>0</sub> + D<sub>1</sub>) ÷ P<sub>0</sub><br>Total return = capital gain + dividend yield</div>`),
N(`Stock returns`, `You buy a stock at $40 (P0). A year later it's $42 (P1) and paid a $1 dividend. What is your one-period return (as a %)?`, 7.5, `%`, W([`Return = (P1 − P0 + D1) ÷ P0`, `= (42 − 40 + 1) ÷ 40`, `= 3 ÷ 40 = 0.075 = 7.50%`])),
M(`Stock returns`, `In the last question, the 7.5% return splits into…`, [`5% capital gain + 2.5% dividend yield`, `7.5% dividend yield only`, `2.5% capital gain + 5% dividend yield`, `It can't be split`], W([`Capital gain = (42 − 40) ÷ 40 = 5.0%`, `Dividend yield = 1 ÷ 40 = 2.5%`, `Total = 7.5%`])),
C(`Shares and book value`, `<ul><li><b>Par value</b> of a stock is an accounting convention ($0.01 typical) — NOT the price.</li><li><b>Authorized</b> shares (allowed), <b>issued</b> (sold), <b>outstanding</b> (held by investors).</li><li><b>Treasury stock</b> = shares the company bought back — reduces shares outstanding.</li><li><b>Book value per share</b> = equity ÷ shares outstanding; market value is usually far higher.</li></ul>`),
M(`Shares & book value`, `A stock's par value is $0.01 but it trades at $85. What is par value?`, [`An accounting convention — not the price`, `What the stock is really worth`, `The dividend`, `The book value per share`], `Par value for stock is just an accounting number.`),
D(`Shares & book value`, `A company buys back its own shares (treasury stock). What happens to shares OUTSTANDING?`, `down`, `Repurchased shares become treasury stock and are no longer outstanding.`),
]},
{name:`Master`, items:[
C(`Dividends: dates and types`, `<ul><li><b>Declaration date</b>: board declares the dividend.</li><li><b>Ex-dividend date</b>: buy ON or AFTER this date → you do NOT get the dividend. The price drops by about the dividend on this date.</li><li><b>Record date</b>, then <b>payment date</b>.</li></ul>
<p>Types: <b>cash</b>; <b>stock dividend</b> (more shares); <b>stock split</b> (more shares, lower price, same total value); <b>stock repurchase</b> (fewer shares, EPS rises).</p>`),
M(`Dividends`, `You buy a stock ON its ex-dividend date. Do you get the upcoming dividend?`, [`No — buying on or after the ex-date means no dividend`, `Yes, always`, `Only half of it`, `Only if you hold it for a year`], `Buy on/after the ex-dividend date → no dividend.`),
D(`Dividends`, `A stock goes ex-dividend with a $2 dividend. What happens to its price that day (all else equal)?`, `down`, `The price drops by about the dividend amount on the ex-date.`),
D(`Dividends`, `A company does a 2-for-1 stock split. What happens to the TOTAL value of your shares?`, `same`, `You get more shares at a lower price — the total value stays the same.`),
D(`Dividends`, `A company repurchases shares (net income unchanged). What happens to EPS?`, `up`, `EPS = net income ÷ shares outstanding. Fewer shares → higher EPS.`),
C(`Shareholder rights`, `<ul><li><b>Proxy voting</b>: voting by mail/online at the annual meeting.</li><li><b>Cumulative voting</b>: helps minority shareholders elect at least one director. <b>Straight voting</b>: elects the whole board at once.</li><li><b>Preemptive right</b>: existing shareholders get the first chance to buy new shares.</li><li><b>Classes of stock</b>: A/B shares with different voting power (dual-class tech companies).</li></ul>`),
M(`Shareholder rights`, `Which voting method helps MINORITY shareholders elect a director?`, [`Cumulative voting`, `Straight voting`, `Proxy fights`, `Dual-class stock`], `Cumulative voting lets minority holders concentrate votes on one director.`),
M(`Shareholder rights`, `A preemptive right gives existing shareholders…`, [`The first chance to buy new shares`, `A guaranteed dividend`, `The right to sell shares back`, `Extra votes`], `Preemptive right = first dibs on new shares, so your ownership isn't diluted.`),
C(`IPOs and exchanges`, `<div class="def"><b>IPO</b> (initial public offering) = a company's first sale of stock to the public.</div>
<p>Figma 2025: priced at $33, opened at $85 (+250% on the first day). "<b>Priced too low</b>" = the company left money on the table. "<b>Popped</b>" = demand exceeded supply.</p>
<p><b>NYSE</b> = auction market with specialists. <b>NASDAQ</b> = dealer market with market makers. <b>Market order</b> = executes now at the best available price. <b>Limit order</b> = only at your price or better.</p>`),

M(`Common vs preferred`, `Roughly how big is the preferred stock market compared with common?`, [`~$400B preferred vs ~$62.8T common`, `About equal`, `Preferred is bigger`, `~$62.8T preferred vs ~$400B common`], `Preferred ~$400B (2024) vs common ~$62.8T (July 2025).`),

U({id:12, name:`Capital Budgeting`, ch:`Foundations of Finance Ch. 10 + 11 · PREVIEW`, icon:`🏗️`, color:`linear-gradient(135deg,#ff9600,#ff4b4b)`, preview:true,
desc:`Payback, NPV, PI and IRR rules; independent vs mutually exclusive; free cash flow format; sunk vs opportunity costs; salvage tax; NOWC.`,
lessons:[
{name:`Learn`, items:[
C(`Is this long-term project worth it?`, `<p><b>Capital budgeting</b> = deciding whether a long-term investment is worth it. Cash goes out first; payback comes later. We use <b>CASH FLOWS</b>, not accounting profit. Every criterion except payback discounts for time value.</p>
<div class="def"><b>Payback period</b> = the time until cumulative cash flows recover the initial outlay. Accept if it's within the firm's cutoff. It <b>ignores time value AND all cash flows after payback</b> — a screen, not a decision.</div>
<p>⚠️ <b>Discounted payback</b> is NOT on Exam 2.</p>`),
M(`Capital budgeting basics`, `Capital budgeting decisions are based on…`, [`Cash flows, not accounting profit`, `Accounting profit only`, `The stock price`, `Last year's revenue`], `Cash flows — cash is what you can actually spend and reinvest.`),
M(`Payback`, `Which criterion does NOT discount for the time value of money?`, [`Payback period`, `NPV`, `PI`, `IRR`], `Payback ignores time value. NPV, PI and IRR all discount cash flows.`),
N(`Payback`, `A project costs $1,000 and brings in $400 per year. What is its payback period (in years)?`, 2.5, `years`, W([`After year 1: 400 recovered (600 left)`, `After year 2: 800 recovered (200 left)`, `Year 3: need 200 of 400 = 0.5 year`, `Payback = 2 + 0.5 = 2.5 years`])),
M(`Payback`, `Project C pays back in 2.5 years; Project D in 2.33 years. What can you conclude?`, [`D pays back faster — but payback says nothing about which creates more value`, `D is definitely the better project`, `C has a higher NPV`, `Both should be rejected`], `Payback only measures speed, not value.`),
M(`Payback`, `Project X pays back in 2 years then earns nothing. Project Y pays back in 3 years then earns $1M. Which does each method pick?`, [`Payback picks X; NPV picks Y`, `Both pick X`, `Both pick Y`, `Payback picks Y; NPV picks X`], `Payback ignores all cash after the payback point — the "payback trap". NPV counts Y's $1M.`),
C(`NPV, PI and IRR`, `<div class="formula">NPV = PV of all future free cash flows − initial outlay → accept if NPV &gt; 0<br>PI = PV of future FCF ÷ initial outlay → accept if PI &gt; 1<br>IRR = the discount rate that makes NPV = 0 → accept if IRR &gt; required rate</div>
<p><b>NPV</b> measures dollars of value created — the best criterion. <b>PI</b> gives the same accept/reject answer as NPV and is used when capital is limited.</p>
<p>⚠️ The <b>IRR calculation</b> and <b>modified IRR</b> are NOT on Exam 2 — know the rule and meaning only.</p>`),
N(`NPV & PI`, `A machine costs $50,000. The PV of its future free cash flows (6 years, 10% required return) is $59,500. What is the NPV?`, 9500, `$`, W([`NPV = PV of future FCF − initial outlay`, `= 59,500 − 50,000 = $9,500.00 → accept (NPV > 0)`])),
N(`NPV & PI`, `Same machine: PV of future FCF $59,500, cost $50,000. What is the profitability index?`, 1.19, ``, W([`PI = PV of future FCF ÷ initial outlay`, `= 59,500 ÷ 50,000 = 1.19 → accept (PI > 1)`])),
M(`NPV & PI`, `When should you accept a project using NPV?`, [`When NPV > 0`, `When NPV < 0`, `When NPV = 1`, `Only when NPV is above $1 million`], `NPV > 0 means the project creates value.`),
M(`NPV & PI`, `A project has PI = 0.92. What do you do — and what does that tell you about NPV?`, [`Reject — PI < 1 means NPV < 0`, `Accept — PI is positive`, `Accept — PI near 1 is fine`, `You can't tell without IRR`], `PI < 1 ↔ NPV < 0 → reject. PI and NPV always agree on accept/reject.`),
M(`IRR rules`, `What is the IRR decision rule?`, [`Accept if IRR > the required rate of return`, `Accept if IRR < the required rate`, `Accept if IRR = 0`, `IRR has no rule`], `IRR = the rate making NPV = 0. Accept if IRR > required rate. (Calculation NOT on Exam 2.)`),
]},
{name:`Drill`, items:[
C(`Ranking projects`, `<ul><li><b>Independent projects</b> (choosing one doesn't affect the others): accept ALL with NPV &gt; 0.</li><li><b>Mutually exclusive</b> (you can only pick one): pick the <b>highest NPV</b>. NPV and IRR can disagree — <b>NPV wins</b> (dollars, not percentages).</li><li><b>Capital rationing</b> (limited money): rank by <b>PI</b> (value per dollar invested).</li></ul>
<p>⚠️ Unequal-life comparisons are NOT on Exam 2.</p>`),
M(`Project ranking`, `Two mutually exclusive projects: A has NPV $40,000 and IRR 18%; B has NPV $55,000 and IRR 14%. Which do you pick?`, [`B — highest NPV wins`, `A — highest IRR wins`, `Both`, `Neither`], `For mutually exclusive projects, pick the highest NPV. NPV measures dollars of value created.`),
M(`Project ranking`, `Three INDEPENDENT projects have NPVs of +$5,000, +$1,000 and −$2,000. Which do you accept?`, [`The two with positive NPV`, `Only the +$5,000 one`, `All three`, `None`], `Independent projects: accept all with NPV > 0.`),
M(`Project ranking`, `Your firm has a limited budget and many positive-NPV projects. How should you rank them?`, [`By profitability index (PI)`, `By payback period`, `By IRR only`, `Alphabetically`], `Capital rationing → rank by PI (value per dollar invested).`),
C(`Free cash flow rules`, `<ul><li>Use <b>incremental, after-tax, free cash flows</b> only.</li><li>Use <b>nominal</b> cash flows with a <b>nominal</b> discount rate.</li><li>Do <b>NOT subtract interest expense</b> in operating cash flow — the discount rate already accounts for financing.</li></ul>
<div class="formula">Initial outlay (Year 0) = asset cost + shipping/installation + increase in NOWC<br>Annual OCF = (Revenue − Cash operating costs − Depreciation) × (1 − tax rate) + Depreciation<br>      = NOPAT + Depreciation<br>Terminal cash flow = OCF + after-tax salvage + NOWC recovery<br>FCF = OCF − investment in NOWC − capital expenditures</div>
<div class="def"><b>NOPAT</b> = net operating profit after taxes.</div>`),
M(`FCF format`, `Should you subtract interest expense when computing a project's operating cash flow?`, [`No — the discount rate already accounts for financing`, `Yes, always`, `Only for bonds`, `Only if interest is tax-deductible`], `Subtracting interest would double-count the cost of financing.`),
N(`FCF format`, `A project: revenue $100,000, cash operating costs $40,000, depreciation $20,000, tax rate 25%. What is the annual operating cash flow?`, 50000, `$`, W([`EBIT = 100,000 − 40,000 − 20,000 = 40,000`, `NOPAT = 40,000 × (1 − 0.25) = 30,000`, `OCF = NOPAT + depreciation`, `= 30,000 + 20,000 = $50,000.00`])),
N(`FCF format`, `Initial outlay: machine $120,000 + shipping/installation $5,000 + increase in NOWC $10,000. What is the Year-0 initial outlay?`, 135000, `$`, W([`Outlay = cost + shipping/installation + NOWC increase`, `= 120,000 + 5,000 + 10,000 = $135,000.00 (outflow)`])),
N(`FCF format`, `Joe's Fruit Stand, Year 3: OCF $56,000, salvage $30,000 (sold at book value, so no tax), NOWC recovery $8,000. What is the terminal-year FCF?`, 94000, `$`, W([`Terminal FCF = OCF + after-tax salvage + NOWC recovery`, `= 56,000 + 30,000 + 8,000 = $94,000.00`])),
M(`FCF format`, `What goes into a project's TERMINAL (final-year) cash flow?`, [`OCF + after-tax salvage + NOWC recovery`, `Only the salvage value`, `Initial outlay + interest`, `Sunk costs + OCF`], `Final year = that year's OCF + after-tax salvage + getting your NOWC back.`),
M(`FCF format`, `Which should you use with NOMINAL cash flows?`, [`A nominal discount rate`, `A real (inflation-adjusted) discount rate`, `No discount rate`, `The coupon rate`], `Match them: nominal cash flows with a nominal rate.`),
]},
{name:`Master`, items:[
C(`Depreciation and after-tax salvage`, `<p><b>Straight-line</b> depreciation (the workbook default unless stated) = cost ÷ life — or, when the problem gives a <b>depreciable basis</b> (like Kramerica's $80,000), basis ÷ life. <b>MACRS</b> = accelerated IRS tables. Depreciation isn't cash; its value is the <b>tax shield</b> = depreciation × tax rate.</p>
<ul><li>Sold <b>ABOVE</b> book value → pay tax on the gain: after-tax salvage = salvage − tax × (salvage − book value).</li><li>Sold <b>AT</b> book value → no tax.</li><li>Sold <b>BELOW</b> book value → the loss creates a tax <b>CREDIT</b>.</li></ul>
<p><b>Kramerica</b>: machine $100,000, 5-yr life, $20,000 salvage, 25% tax → depreciable basis $80,000 → $16,000/yr; book value after 5 yrs = $20,000.</p>`),
N(`Depreciation & salvage`, `Kramerica: machine $100,000, depreciable basis $80,000 (cost minus $20,000 salvage), 5-year life, straight-line. What is annual depreciation?`, 16000, `$`, W([`Depreciation = depreciable basis ÷ life`, `= 80,000 ÷ 5 = $16,000.00 per year`])),
N(`Depreciation & salvage`, `Kramerica's depreciation is $16,000/yr and the tax rate is 25%. What is the annual depreciation tax shield?`, 4000, `$`, W([`Tax shield = depreciation × tax rate`, `= 16,000 × 0.25 = $4,000.00 per year`])),
N(`Depreciation & salvage`, `Kramerica's machine has a book value of $20,000 and is sold for $30,000. Tax rate 25%. What is the AFTER-TAX salvage value?`, 27500, `$`, W([`Gain = 30,000 − 20,000 = 10,000`, `Tax on gain = 10,000 × 0.25 = 2,500`, `After-tax salvage = 30,000 − 2,500 = $27,500.00`])),
N(`Depreciation & salvage`, `Kramerica's machine (book value $20,000) is sold for only $10,000. Tax rate 25%. What is the AFTER-TAX salvage value?`, 12500, `$`, W([`Loss = 10,000 − 20,000 = −10,000`, `Tax CREDIT = 10,000 × 0.25 = 2,500`, `After-tax salvage = 10,000 + 2,500 = $12,500.00`])),
N(`Depreciation & salvage`, `Del Boca Vista: depreciation $12,500/yr, tax rate 20%. What is the annual tax saving?`, 2500, `$`, W([`Tax saving = 12,500 × 0.20 = $2,500.00 per year`])),
M(`Depreciation & salvage`, `A machine is sold for EXACTLY its book value. What is the tax?`, [`No tax — no gain or loss`, `Tax on the full sale price`, `A tax credit`, `Double tax`], `At book value there's no gain or loss → no tax.`),
C(`Which cash flows count?`, `<ul><li><b>Sunk costs</b>: already spent (past market research, prior R&amp;D, a patent already licensed) → <b>EXCLUDE</b>.</li><li><b>Opportunity costs</b>: value given up (forgone rent on a warehouse you own) → <b>INCLUDE</b>.</li><li><b>Cannibalization</b>: the new product steals existing sales → <b>REDUCES</b> incremental revenue.</li><li><b>Synergies</b>: the new product boosts existing sales → <b>ADD</b>.</li><li><b>NOWC</b>: an increase is a cash <b>OUTFLOW at the start</b>; it is <b>RECOVERED at the end</b>.</li></ul>
<p>Example: Monk's Brew incremental revenue = $1,831,790 after netting out cannibalization.</p>`),
M(`Relevant cash flows`, `Last year you spent $200,000 on market research for a new product. Do you include it in the project's cash flows?`, [`No — it's a sunk cost`, `Yes — as an outflow at Year 0`, `Yes — as an opportunity cost`, `Only half of it`], `It's already spent and can't be recovered either way → sunk → exclude.`),
M(`Relevant cash flows`, `The project would use a warehouse you own that you could otherwise rent out for $50,000/yr. Do you include that rent?`, [`Yes — it's an opportunity cost`, `No — you already own it`, `No — it's a sunk cost`, `Only if you sell the warehouse`], `Forgone rent is an opportunity cost → include it.`),
D(`Relevant cash flows`, `A new product will steal some sales from your existing product (cannibalization). What happens to the project's INCREMENTAL revenue?`, `down`, `Cannibalized sales are subtracted — incremental revenue falls (that's how Monk's Brew got its $1,831,790 net figure).`),
D(`Relevant cash flows`, `A new product will boost sales of your existing products (synergy). What happens to incremental cash flows?`, `up`, `Synergies ADD to incremental cash flows.`),
M(`NOWC`, `A project needs $8,000 more inventory and receivables at the start. How is that NOWC treated?`, [`Outflow at the start, recovered at the end`, `Ignored completely`, `Inflow at the start`, `Sunk cost`], `NOWC increase = cash outflow at Year 0; you get it back when the project ends.`),
]},
]});

  const v = parseNum(raw); if(isNaN(v)) return null;

  const tot = R.refill ? 3 : R.queue.length;
  const pct = Math.round(doneCount/tot*100);
  let h = '<div class="lesson-top"><button class="x" onclick="quitRun()" title="Quit">✕</button><div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += R.mode==='boss' ? '<span class="timer" id="timer">⏱</span>' : '<span class="pill heart">❤️ '+S.hearts+'</span>';
  h += '</div><div class="lesson-meta"><span>'+esc(R.title)+'</span><span>'+(R.combo>=3?'<span class="combo">🔥 '+R.combo+' in a row!</span> · ':'')+(isRefill?'Heart refill '+(R.refill.i+1)+'/3':'Item '+(R.pos+1)+' of '+R.queue.length)+'</span></div>';
  if(isRefill) h += '<div class="banner">💔 Out of hearts! Answer 3 quick review questions to refill all 5 hearts. No penalties here.</div>';
  h += '<div class="qcard">';
  if(it.t==='card'){
    h += '<div class="teach"><div class="kicker">📘 New idea</div><h2>'+it.title+'</h2><div class="body">'+it.html+'</div></div>';
    h += '<div class="checkrow"><button class="btn blue" id="go" onclick="nextItem()">Got it →</button></div></div>';
    $app.innerHTML = h; window.scrollTo(0,0); document.getElementById('go').focus(); return;
  }
  const kick = it.review ? '<div class="kicker rev">🔁 Comeback question — you missed this one before</div>' :
    '<div class="kicker">'+({mc:'Choose the answer',fill:'Fill in the blank',num:'Work it out',dir:'What happens?'}[it.t])+'</div>';
  h += kick + '<div class="qtext">'+it.q+'</div>';
  if(it.t==='mc'){
    R.order = shuffle(it.o.map((o,i)=>({o,i})));
    h += '<div class="opts">'+R.order.map((x,k)=>'<button class="opt" data-k="'+k+'" onclick="selOpt('+k+')"><span class="k">'+(k+1)+'</span><span>'+x.o+'</span></button>').join('')+'</div>';
  } else if(it.t==='dir'){
    const D3=[['up','⬆️','Rises / goes up'],['down','⬇️','Falls / goes down'],['same','➡️','No change']];
    R.order = D3.map(d=>({o:d[2],i:d[0]}));
    h += '<div class="opts dirs">'+D3.map((d,k)=>'<button class="opt" data-k="'+k+'" onclick="selOpt('+k+')"><span class="big">'+d[1]+'</span><span>'+d[2]+'</span></button>').join('')+'</div>';
  } else {
    const ph = it.t==='num' ? (it.u==='$'?'e.g. 1234.56':it.u==='%'?'e.g. 8.25':it.u==='x'?'e.g. 1.94':'type a number') : 'type your answer';
    const pre = it.t==='num' && it.u==='$' ? '<span class="unitlbl">$</span>' : '';
    const post = it.t==='num' && it.u && it.u!=='$' ? '<span class="unitlbl">'+(it.u==='%'?'%':it.u==='x'?'x':it.u)+'</span>' : '';
    h += '<div class="inrow">'+pre+'<input id="ans" autocomplete="off" '+(it.t==='num'?'inputmode="decimal"':'')+' placeholder="'+ph+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();check();}">'+post+'</div>';
    if(it.t==='num') h += '<div class="hint">'+(it.u==='$'?'Money: round to 2 decimals. ':it.u==='%'?'Percent: type 8.25 for 8.25%. ':it.u==='x'?'Ratio: 2 decimals. ':'')+'Answers within a small rounding tolerance count. Use the formula sheet in your head — or scratch paper!</div>';
  }
  h += '<div class="checkrow"><button class="btn" id="checkbtn" onclick="check()" '+(it.t==='mc'||it.t==='dir'?'disabled':'')+'>Check</button></div></div><div id="fbzone"></div>';
  $app.innerHTML = h; window.scrollTo(0,0);
  const inp = document.getElementById('ans'); if(inp) inp.focus();
  if(R.mode==='boss') tickTimer();
}
function selOpt(k){
  if(R.answered) return;
  R.sel = k;
  document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel', +b.dataset.k===k));
  document.getElementById('checkbtn').disabled = false;
}
document.addEventListener('keydown', e=>{
  if(!R) return;
  const it = curItem(); if(!it) return;
  if(e.target.tagName==='INPUT') return;
  if(!R.answered && (it.t==='mc'||it.t==='dir') && /^[1-4]$/.test(e.key)){ const k=+e.key-1; if(k<R.order.length) selOpt(k); }
  else if(e.key==='Enter'){
    e.preventDefault();
    if(it.t==='card') nextItem();
    else if(R.answered) nextItem();
    else if(R.sel!=null) check();
  }
});

function check(){
  if(R.answered) return;
  const it = curItem();
  let ok;
  if(it.t==='mc'){ if(R.sel==null) return; ok = R.order[R.sel].i===0; }
  else if(it.t==='dir'){ if(R.sel==null) return; ok = R.order[R.sel].i===it.a; }
  else if(it.t==='fill'){ const v=document.getElementById('ans').value; if(!v.trim()) return; ok = it.a.some(a=>norm(a)===norm(v)); }
  else { const v=document.getElementById('ans').value; const r=checkNum(it, v); if(r===null){ toast('Type a number first'); return; } ok=r; }
  R.answered = true;
  record(it, ok);
  // mark options
  if(it.t==='mc'||it.t==='dir'){
    document.querySelectorAll('.opt').forEach(b=>{
      const k=+b.dataset.k; const isRight = it.t==='mc' ? R.order[k].i===0 : R.order[k].i===it.a;
      if(isRight) b.classList.add('right'); else if(k===R.sel) b.classList.add('wrong');
    });
  } else { const inp=document.getElementById('ans'); inp.disabled=true; inp.style.borderColor = ok?'var(--green)':'var(--red)'; }
  document.getElementById('checkbtn').style.display='none';
  let rightTxt = '';
  if(it.t==='mc') rightTxt = it.o[0];
  else if(it.t==='dir') rightTxt = {up:'⬆️ It rises',down:'⬇️ It falls',same:'➡️ No change'}[it.a];
  else if(it.t==='fill') rightTxt = it.a[0];
  else rightTxt = fmtAns(it);
  let fb;
  if(ok){
    if(!R.refill){
      R.right++; R.combo++; R.maxCombo=Math.max(R.maxCombo,R.combo);
      const gain = 10 + (R.combo>=5?5:0);
      R.xp += gain; S.xp += gain;
      if(it.review) clearMiss(it);
    }
    fb = '<div class="fb ok"><h4>✅ '+pick(CHEERS)+(R.refill?'':' <span style="font-size:15px">+'+(10+(R.combo>=5?5:0))+' XP</span>')+'</h4>';
    if(it.t==='num') fb += '<div class="ex"><b>Answer: '+rightTxt+'</b>'+(it.e?'<br>'+it.e:'')+'</div>';
    else if(it.e) fb += '<div class="ex">'+it.e+'</div>';
  } else {
    if(!R.refill){
      R.wrong++; R.combo=0;
      addMiss(it);
      if(R.mode==='lesson'){
        S.hearts = Math.max(0, S.hearts-1);
        // spaced repetition: same question returns later in this lesson
        const back = Object.assign({}, it, {review:true});
        R.queue.splice(Math.min(R.queue.length, R.pos+4), 0, back);
      }
    }
    fb = '<div class="fb no"><h4>❌ '+pick(OOPS)+'</h4><div class="ex"><b>Correct answer: '+rightTxt+'</b><br>'+(it.e||'')+'</div>';
    if(R.mode==='lesson' && !R.refill) fb += '<div style="font-weight:800;margin-bottom:8px">🔁 This one will come back later so you can lock it in.</div>';
  }
  fb += '<div class="row"><span></span><button class="btn '+(ok?'':'red')+'" id="nextbtn" onclick="nextItem()">Continue →</button></div></div>';
  document.getElementById('fbzone').innerHTML = fb;
  document.getElementById('nextbtn').focus({preventScroll:true});
  document.getElementById('fbzone').scrollIntoView({behavior:'smooth',block:'end'});
  updateTop(); save();
}
function nextItem(){
  if(R.refill){
    R.refill.i++;
    if(R.refill.i>=3){ R.refill=null; S.hearts=5; save(); toast('❤️ Hearts refilled! Back to the lesson.'); }
    renderItem(); return;
  }
  R.pos++;
  if(R.mode==='lesson' && S.hearts<=0 && R.pos<R.queue.length){
    // heart refill drill: 3 quick questions from this unit's earlier lessons (or this lesson)
    const u = unitById(R.uid);
    let pool = u.lessons.slice(0, R.li+1).flatMap(L=>L.items).filter(x=>x.t==='mc'||x.t==='dir');
    R.refill = {items: shuffle(pool).slice(0,3), i:0};
  }
  renderItem();
}
function quitRun(){
  if(R && R.mode==='boss' && !confirm('Leave the mock exam? Your progress in this attempt will be lost.')) return;
  if(R && R.mode!=='boss' && R.pos>0 && !confirm('Quit this lesson? XP you earned is kept, but the lesson won\'t be marked complete.')) return;
  clearInterval(timerId); R=null; save(); renderMap();
}

function finishRun(){
  clearInterval(timerId);
  const run = R; R = null;
  const answered = run.right + run.wrong;
  let unitJustDone = false, title='Lesson complete!', emoji='🎉', extra='';
  if(run.mode==='lesson'){
    const k = lessonKey(run.uid, run.li);
    const u = unitById(run.uid);
    const before = unitDone(u);
    S.done[k] = true;
    S.hearts = 5;
    const bonus = 20 + (run.wrong===0?10:0);
    S.xp += bonus; run.xp += bonus;
    unitJustDone = !before && unitDone(u);
    if(run.wrong===0) extra = '<p><b>Perfect lesson! +10 bonus XP</b> 🌟</p>';
    if(unitJustDone){ title='Unit complete: '+u.name+'!'; emoji='🏆'; }
  } else if(run.mode==='practice'){
    title='Practice done!'; emoji='💪';
  } else if(run.mode==='boss'){
    const score = run.right / run.total;
    S.boss.tries++;
    if(S.boss.best==null || score>S.boss.best) S.boss.best = score;
    const pass = score >= BOSS_PASS;
    title = pass ? 'You beat the Boss! Mock Exam passed!' : 'Boss not beaten yet — so close!';
    emoji = pass ? '👑' : '🛡️';
    extra = '<p style="font-size:20px"><b>Score: '+run.right+' / '+run.total+' = '+Math.round(score*100)+'%</b> (pass = 85%, i.e. 17/20)</p>' +
      (pass ? '<p>That\'s exam-ready territory. Check your topic report for any last weak spots.</p>' : '<p>Open the Topic Report to see exactly which topics to review, then try again — each attempt draws a fresh mix.</p>');
    if(pass) unitJustDone = true;
    const bonus = pass?100:20; S.xp += bonus; run.xp += bonus;
  }
  // day streak
  const t = today();
  if(S.lastDay !== t){ S.streak = (S.lastDay===yesterday()) ? S.streak+1 : 1; S.lastDay = t; }
  save(); updateTop();
  const acc = answered ? Math.round(run.right/answered*100) : 100;
  let h = '<div class="result center"><div class="big">'+emoji+'</div><h2>'+esc(title)+'</h2>'+extra;
  h += '<div class="tiles"><div class="tile"><div class="h">XP earned</div><div class="v">⚡ '+run.xp+'</div></div>';
  h += '<div class="tile g"><div class="h">Accuracy</div><div class="v">🎯 '+acc+'%</div></div>';
  h += '<div class="tile b"><div class="h">Best streak</div><div class="v">🔥 '+run.maxCombo+'</div></div></div>';
  h += '<div class="hero" style="text-align:left"><div class="mascot">🐂</div><div class="bubble">'+(acc>=90?'Outstanding, Kiaan! You\'re really getting this.':acc>=70?'Solid work! The questions you missed are saved for comeback practice.':'Every miss is a lesson learned. Those questions will come back so they stick — keep going!')+'</div></div>';
  h += '<div class="toolbar" style="justify-content:center">';
  if(run.mode==='boss') h += '<button class="btn purple" onclick="renderReport()">📊 Topic report</button>';
  h += '<button class="btn" onclick="renderMap()">Continue</button></div></div>';
  $app.innerHTML = h; window.scrollTo(0,0);
  if(unitJustDone) confetti();
}

/* ---------- MAP ---------- */
function renderMap(){
  R = null; updateTop();
  const done = doneLessons(), tot = totalLessons();
  const pct = Math.round(done/tot*100);
  let h = '<div class="hero"><div class="mascot">🐂</div><div class="bubble">'+pick(MASCOT_LINES)+'</div></div>';
  h += '<div class="stats"><div class="stat"><b>'+pct+'%</b><span>Complete</span></div><div class="stat"><b>'+done+'/'+tot+'</b><span>Lessons</span></div><div class="stat"><b>≈ '+fmtMins(minsLeft())+'</b><span>left</span></div><div class="stat"><b>'+S.xp+'</b><span>Total XP</span></div></div>';
  h += '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="toolbar"><button class="btn purple small" onclick="renderReport()">📊 Topic report</button><button class="btn blue small" onclick="renderSheet()">📄 Formula sheet</button><button class="btn gold small" onclick="startPractice()">💪 Weak-spot practice ('+Object.values(S.miss).flat().length+')</button><button class="btn ghost small" onclick="resetAll()">↺ Reset progress</button></div>';
  h += '<div class="section-h">Core path · taught in class through Oct 28 (Exam 1 material)</div>';
  UNITS.filter(u=>!u.preview).forEach(u=>h+=unitHTML(u));
  h += '<div class="section-h">Preview units · slides posted, taught Nov 2–23 (Exam 2)</div>';
  UNITS.filter(u=>u.preview).forEach(u=>h+=unitHTML(u));
  // boss
  const bu = bossUnlocked();
  h += '<div class="section-h">Final challenge</div><div class="unit '+(bu?'':'locked')+'"><div class="unit-h" style="background:linear-gradient(135deg,#ce82ff,#ff4b4b)"><span class="ico">👑</span><div><h3>13 · BOSS LEVEL — Mock Exam 2</h3><small>20 questions · 60-minute timer · pass = 85%</small></div><span class="tag">'+(S.boss.best!=null?'BEST '+Math.round(S.boss.best*100)+'%':'BOSS')+'</span></div>';
  h += '<div class="unit-desc">Mixes all units, weighted toward ratios and free cash flow, plus 5 Exam 1 review questions. No hearts lost here — it works like the real exam. '+(bu?'':'<b>Unlocks when you finish Unit 8 (Ratios) and Unit 12 (Capital Budgeting).</b>')+'</div>';
  h += '<div class="unit-b"><button class="btn purple" '+(bu?'':'disabled')+' onclick="startBoss()">'+(bu?'⚔️ Start the mock exam':'🔒 Locked')+'</button></div></div>';
  $app.innerHTML = h; window.scrollTo(0,0);
}
function unitHTML(u){
  const un = unitUnlocked(u), ud = unitDone(u);
  let h = '<div class="unit '+(un?'':'locked')+'"><div class="unit-h" style="background:'+u.color+'"><span class="ico">'+u.icon+'</span><div><h3>'+u.id+' · '+esc(u.name)+'</h3><small>'+esc(u.ch)+'</small></div><span class="tag">'+(ud?'✓ DONE':u.preview?'PREVIEW':un?'CORE':'🔒 LOCKED')+'</span></div>';
  h += '<div class="unit-b">';
  const icons = ['📘','🏋️','⭐'];
  u.lessons.forEach((L,li)=>{
    const lu = lessonUnlocked(u,li), ld = S.done[lessonKey(u.id,li)];
    const nq = L.items.filter(x=>x.t!=='card').length;
    h += '<div class="node"><button class="dot '+(ld?'done':lu?'':'lock')+'" style="background:'+u.color+'" '+(lu?'onclick="startLesson('+u.id+','+li+')"':'disabled')+' title="'+esc(L.name)+'">'+(ld?'✓':lu?icons[li]:'🔒')+'</button><div class="lbl">'+esc(L.name)+'<br><span style="font-weight:600">'+nq+' Qs</span></div></div>';
  });
  h += '</div><div class="unit-desc">'+u.desc+'</div></div>';
  return h;
}
function resetAll(){
  if(!confirm('Reset ALL progress, XP and stats? This cannot be undone.')) return;
  S = freshState(); save(); renderMap(); toast('Progress reset. Fresh start! 🌱');
}

/* ---------- REPORT ---------- */
function renderReport(){
  R=null;
  let h = '<div class="lesson-top"><button class="x" onclick="renderMap()">✕</button><h2 style="margin:0">📊 Topic Report</h2></div>';
  h += '<p>Your accuracy on every topic you\'ve answered so far (all attempts, including comeback questions). Anything under <b class="weak">70%</b> is a weak spot — hit "Weak-spot practice" or replay that lesson.</p>';
  const byUnit = {};
  Object.entries(S.stats).forEach(([k,v])=>{ const [uid,tag]=k.split('|'); (byUnit[uid]=byUnit[uid]||[]).push({tag,...v}); });
  const order = UNITS.map(u=>String(u.id)).concat(['13']);
  let any=false, weakList=[];
  order.forEach(uid=>{
    const rows = byUnit[uid]; if(!rows) return; any=true;
    const u = unitById(+uid);
    const name = u ? u.id+' · '+u.name : '13 · Boss Mock Exam';
    const c = rows.reduce((s,r)=>s+r.c,0), a = rows.reduce((s,r)=>s+r.a,0);
    const p = Math.round(c/a*100);
    h += '<div class="rep-unit"><h3><span>'+esc(name)+'</span><span class="'+(p<70?'weak':'strong')+'">'+p+'%</span></h3>';
    rows.sort((x,y)=>x.c/x.a - y.c/y.a).forEach(r=>{
      const rp = Math.round(r.c/r.a*100);
      if(rp<70) weakList.push(r.tag+' ('+(u?'Unit '+u.id:'Boss')+')');
      h += '<div class="rep-row"><span>'+(rp<70?'⚠️ ':'')+esc(r.tag)+' <span style="color:#999">('+r.c+'/'+r.a+')</span></span><div class="bar"><i style="width:'+rp+'%;background:'+(rp<70?'var(--red)':rp<85?'var(--gold)':'var(--green)')+'"></i></div><b class="'+(rp<70?'weak':'')+'">'+rp+'%</b></div>';
    });
    h += '</div>';
  });
  if(!any) h += '<div class="hero"><div class="mascot">🐂</div><div class="bubble">No answers yet! Play a lesson and your topic scores will show up here.</div></div>';
  else if(weakList.length) h = h.replace('</p>','</p><div class="banner">Focus list: '+weakList.slice(0,10).map(esc).join(' · ')+'</div>');
  else h = h.replace('</p>','</p><div class="banner blue">No weak spots right now — every topic is at 70%+. 🎯</div>');
  h += '<div class="toolbar"><button class="btn gold" onclick="startPractice()">💪 Weak-spot practice</button><button class="btn blue" onclick="renderSheet()">📄 Formula sheet</button><button class="btn ghost" onclick="renderMap()">Back to map</button></div>';
  $app.innerHTML = h; window.scrollTo(0,0);
}

/* ---------- FORMULA SHEET ---------- */
function renderSheet(){
  R=null;
  let h = '<div class="lesson-top"><button class="x" onclick="renderMap()">✕</button><h2 style="margin:0">📄 Formula + Ratio Sheet</h2></div>';
  h += '<p>Two sides = one 8.5"×11" sheet (front and back), sized to print on US Letter. Use it as the starting point for your allowed notes sheet, and add your own weak spots from the Topic Report. The official exam formula sheet always wins if anything differs.</p>';
  h += '<div class="toolbar"><button class="btn blue" onclick="window.print()">🖨️ Print (2 pages = front & back)</button><button class="btn ghost" onclick="renderMap()">Back to map</button></div>';
  h += SHEET_HTML;
  $app.innerHTML = h; window.scrollTo(0,0);
  document.getElementById('printzone').innerHTML = SHEET_HTML;
}

/* ---------- CONFETTI ---------- */
function confetti(){
  const cv = document.getElementById('confetti'); const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
  const P = Array.from({length:180},()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5, w:6+Math.random()*7, h:8+Math.random()*8, vy:2+Math.random()*4, vx:-2+Math.random()*4, r:Math.random()*6, vr:-.2+Math.random()*.4, c:pick(cols)}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(t-t0<3500) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

renderMap();
</script>
</body></html>
