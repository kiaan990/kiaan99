<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FI118 Finance Quest</title>
<style>
:root{
  --green:#58cc02; --green-d:#46a302; --green-l:#d7ffb8;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#ddf4ff;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-l:#ffdfe0;
  --gold:#ffc800; --gold-d:#e5a800; --purple:#ce82ff; --purple-d:#a568cc;
  --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; --bg:#f7f9fc; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;color:var(--green);font-size:22px;letter-spacing:-.5px;margin-right:auto;display:flex;align-items:center;gap:6px}
.pill{font-weight:800;display:flex;align-items:center;gap:4px;font-size:16px}
.pill.fire{color:#ff9600}.pill.gem{color:var(--blue)}.pill.heart{color:var(--red)}
.btn{border:none;border-radius:16px;padding:12px 20px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;font-size:15px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#4b3a00}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.ghost{background:#fff;color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:8px 14px;font-size:13px;border-radius:12px}
.btn[disabled]{background:#e5e5e5;color:#afafaf;box-shadow:0 4px 0 #ccc;cursor:default}
/* hero */
.hero{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin:18px 0}
.mascot{font-size:56px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{background:var(--blue-l);border-radius:16px;padding:10px 14px;font-weight:700;position:relative;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.bar{height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
/* map */
.section-h{margin:28px 0 8px;font-weight:900;font-size:14px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.unit{background:#fff;border:2px solid var(--line);border-radius:22px;margin:14px 0;overflow:hidden}
.unit-h{padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px}
.unit-h .ico{font-size:34px}
.unit-h h3{margin:0;font-size:19px;font-weight:900}
.unit-h small{display:block;opacity:.92;font-weight:700}
.unit-h .tag{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900;letter-spacing:.6px;white-space:nowrap}
.unit.locked .unit-h{background:#afafaf!important}
.unit-b{padding:12px 16px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;flex:1}
.node .dot{width:66px;height:62px;border-radius:50%;border:none;font-size:28px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.node .dot.lock{background:#e5e5e5!important;color:#afafaf;box-shadow:0 6px 0 #ccc;cursor:not-allowed}
.node .dot.done{background:var(--gold)!important;box-shadow:0 6px 0 var(--gold-d)}
.node .lbl{font-weight:800;font-size:13px;color:var(--muted);text-align:center}
.unit-desc{padding:0 16px 14px;color:var(--muted);font-size:14px}
/* lesson */
.lesson-top{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.lesson-top .x{background:none;border:none;font-size:26px;color:#afafaf;padding:0 4px}
.lesson-top .bar{flex:1}
.lesson-meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;font-size:13px;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.qcard{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:6px}
.kicker{font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--purple-d);margin-bottom:8px}
.kicker.rev{color:#ff9600}
.qtext{font-size:20px;font-weight:700;margin:0 0 18px}
.qtext small{font-weight:600;color:var(--muted);font-size:15px;display:block;margin-top:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 16px;font-weight:700;color:var(--ink);display:flex;gap:12px;align-items:center}
.opt .k{border:2px solid var(--line);border-radius:8px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt:hover{background:#f7f7f7}
.opt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.dirs{grid-template-columns:repeat(3,1fr)}
.dirs .opt{flex-direction:column;justify-content:center;text-align:center;font-size:16px}
.dirs .opt .big{font-size:30px}
.inrow{display:flex;gap:10px;align-items:center}
.inrow input{flex:1;font-size:22px;font-weight:800;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:#f7f7f7;font-family:inherit;color:var(--ink);min-width:0}
.inrow input:focus{outline:none;border-color:var(--blue);background:#fff}
.unitlbl{font-weight:900;color:var(--muted);font-size:20px}
.hint{color:var(--muted);font-size:14px;margin-top:8px;font-weight:600}
.teach h2{margin:0 0 10px;font-size:23px;color:var(--blue-d)}
.teach .body{font-size:17px}
.teach .body ul{padding-left:20px;margin:8px 0}
.teach .body li{margin:4px 0}
.formula{background:var(--blue-l);border-radius:12px;padding:10px 14px;font-weight:800;margin:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;overflow-x:auto}
.def{background:#fff8e0;border-left:5px solid var(--gold);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:15px}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.t td,table.t th{border:1px solid var(--line);padding:5px 8px;text-align:left}
table.t th{background:#f1f5f9}
.checkrow{display:flex;justify-content:flex-end;margin-top:18px}
.fb{position:sticky;bottom:0;margin-top:18px;border-radius:20px;padding:16px 18px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.fb.ok{background:var(--green-l);color:var(--green-d)}
.fb.no{background:var(--red-l);color:var(--red-d)}
.fb h4{margin:0 0 6px;font-size:21px;font-weight:900}
.fb .ex{color:var(--ink);font-size:16px;background:rgba(255,255,255,.75);border-radius:12px;padding:10px 12px;margin:8px 0 12px;max-height:46vh;overflow:auto}
.fb .ex .work{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;display:block;margin-top:6px}
.fb .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.combo{font-weight:900;color:#ff9600}
.banner{background:var(--red-l);color:var(--red-d);border-radius:14px;padding:10px 14px;font-weight:800;margin:10px 0}
.banner.blue{background:var(--blue-l);color:var(--blue-d)}
.timer{font-weight:900;font-size:18px;color:var(--purple-d)}
.timer.low{color:var(--red)}
/* result */
.center{text-align:center}
.result .big{font-size:84px;margin:20px 0 0}
.result h2{font-size:30px;margin:8px 0;color:var(--gold-d)}
.tiles{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.tile{border:2px solid var(--gold);border-radius:16px;overflow:hidden;min-width:120px}
.tile .h{background:var(--gold);color:#fff;font-weight:900;font-size:12px;padding:4px;text-transform:uppercase}
.tile .v{font-weight:900;font-size:24px;padding:8px}
.tile.g{border-color:var(--green)}.tile.g .h{background:var(--green)}
.tile.b{border-color:var(--blue)}.tile.b .h{background:var(--blue)}
/* report */
.rep-unit{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.rep-unit h3{margin:0 0 6px;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.rep-row{display:grid;grid-template-columns:1fr 120px 60px;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.rep-row .bar{height:10px}
.weak{color:var(--red-d);font-weight:800}
.strong{color:var(--green-d);font-weight:800}
/* sheet */
.sheet-page{background:#fff;border:1px solid #ccc;padding:.32in;margin:16px auto;width:8.5in;max-width:100%;font-size:9pt;line-height:1.25;font-family:Arial,Helvetica,sans-serif;color:#000}
.sheet-page h1{font-size:10.5pt;margin:0 0 3px;border-bottom:2px solid #000;padding-bottom:2px;display:flex;justify-content:space-between}
.sheet-page .cols{column-count:3;column-gap:.16in;column-rule:1px solid #ddd}
.sheet-page h2{font-size:9.6pt;margin:4px 0 1px;background:#e8f5e9;padding:1px 3px;break-after:avoid}
.sheet-page p,.sheet-page ul{margin:0 0 2px}
.sheet-page ul{padding-left:10px}
.sheet-page li{margin:0}
.sheet-page code{font-family:Consolas,Menlo,monospace;font-size:8.6pt;background:#f3f3f3;padding:0 1px;overflow-wrap:anywhere}
.sheet-page .blk{break-inside:avoid;margin-bottom:3px}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  body>*:not(#printzone){display:none!important}
  #printzone{display:block!important}
  .sheet-page{border:none;margin:0;width:8.5in;height:11in;overflow:hidden;page-break-after:always}
}
#printzone{display:none}
/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:1000;animation:up .2s}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .qtext{font-size:18px}
  .node{min-width:70px}
  .node .dot{width:56px;height:54px;font-size:24px}
  .rep-row{grid-template-columns:1fr 70px 46px}
  .brand{font-size:19px}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><span>🐂</span> Finance Quest</div>
  <div class="pill fire" title="Day streak">🔥 <span id="t-streak">0</span></div>
  <div class="pill gem" title="Total XP">⚡ <span id="t-xp">0</span> XP</div>
  <div class="pill heart" title="Hearts">❤️ <span id="t-hearts">5</span></div>
</div></div>
<div class="wrap" id="app"></div>
<canvas id="confetti"></canvas>
<div id="printzone"></div>
<script>
/* ===== Question builders =====
 C(title, html)                    teaching card (no score)
 M(tag, q, [right, w1, w2, w3], e) multiple choice (right answer listed first, shuffled on screen)
 T(tag, q, [accepted...], e)       fill-in-the-blank (case/spacing ignored)
 N(tag, q, answer, unit, e, tol)   numeric; unit: '$' '%' 'x' 'days' 'years' '' ; tol = relative (default 1%)
 D(tag, q, 'up'|'down'|'same', e)  "what happens?" direction question
*/
function C(title, html){return {t:'card', title, html};}
function M(tag, q, o, e){return {t:'mc', tag, q, o, e};}
function T(tag, q, a, e){return {t:'fill', tag, q, a, e};}
function N(tag, q, a, u, e, tol){return {t:'num', tag, q, a, u:u||'', e, tol:(tol==null?0.01:tol)};}
function D(tag, q, a, e){return {t:'dir', tag, q, a, e};}
function W(lines){return '<span class="work">'+lines.join('<br>')+'</span>';}
const UNITS = [];
const BOSS = [];
function U(def){UNITS.push(def);}
/* ===================== UNIT 1 — FINANCE FOUNDATIONS ===================== */
U({id:1, name:`Finance Foundations`, ch:`Foundations of Finance Ch. 1`, icon:`🏛️`, color:`linear-gradient(135deg,#58cc02,#3fa000)`, preview:false,
desc:`The goal of the firm, the 5 principles, agency problems, the 3 big decisions, forms of business and double taxation.`,
lessons:[
{name:`Learn`, items:[
C(`What is a company trying to do?`, `<p>In finance, the goal of the firm is to <b>maximize shareholder wealth</b> — which means <b>maximizing the price of the existing common stock</b>.</p>
<div class="def"><b>Shareholder</b> = an owner of the company. <b>Common stock</b> = the ordinary ownership shares of a company.</div>
<p>Two twists:</p><ul><li><b>Public benefit corporation (PBC)</b> = a company that balances profit with a social or environmental mission.</li><li><b>Triple bottom line</b> = judging a business on <b>people, planet, and profit</b>.</li></ul>`),
M(`Goal of the firm`, `According to the course, what is the goal of the firm?`, [`Maximize shareholder wealth (the price of existing common stock)`, `Maximize total sales revenue`, `Minimize the company's taxes`, `Maximize the number of employees`], `Finance says the firm should maximize shareholder wealth — and the way we measure that is the price of the existing common stock.`),
M(`Goal of the firm`, `A <b>public benefit corporation (PBC)</b> is a company that…`, [`Balances profit with a social or environmental mission`, `Is owned by the government`, `Pays no taxes at all`, `Cannot earn a profit`], `A PBC still earns profit, but it is set up to balance that profit with a social/environmental mission.`),
M(`Goal of the firm`, `The "triple bottom line" measures a business on which three things?`, [`People, planet, profit`, `Revenue, expenses, taxes`, `Assets, liabilities, equity`, `Cash, credit, capital`], `Triple bottom line = people, planet, profit.`),
C(`The 5 principles of finance`, `<ol><li><b>Cash flow is what matters.</b> Decisions use <b>incremental cash flows</b> = the cash flows <i>with</i> the project minus <i>without</i> it. Accounting profit is NOT cash flow.</li>
<li><b>Money has a time value</b> — a dollar today beats a dollar later. Plus <b>opportunity cost</b> = the next-best alternative you give up.</li>
<li><b>Risk requires a reward.</b> Nobody takes extra risk without expecting extra return.</li>
<li><b>Market prices are generally right.</b> Efficient markets reflect public info — but behavioral biases can distort prices.</li>
<li><b>Conflicts of interest cause agency problems</b> (managers vs. owners). Reduced by monitoring, stock-based pay, and takeovers.</li></ol>`),
M(`5 Principles`, `Principle 1 says decisions should be based on <b>incremental cash flows</b>. What does "incremental" mean?`, [`The cash flows WITH the project minus the cash flows WITHOUT it`, `The company's total accounting profit`, `Only the cash flows in the first year`, `The cash flows of the whole industry`], `Incremental = the difference the project makes: cash flows with the project minus cash flows without it.`),
M(`5 Principles`, `Which statement matches Principle 1?`, [`Accounting profit is NOT the same as cash flow`, `Accounting profit is exactly equal to cash flow`, `Only revenue matters, not costs`, `Cash flow matters only for small businesses`], `Principle 1: cash flow is what matters. Accounting profit is not cash flow (for example, depreciation lowers profit but costs no cash that year).`),
M(`5 Principles`, `You skip a $15/hour job to study. In finance, that $15/hour you gave up is your…`, [`Opportunity cost`, `Sunk cost`, `Agency cost`, `Interest expense`], `Opportunity cost = the value of the next-best alternative you give up. Here it's the wages you didn't earn.`),
M(`5 Principles`, `Why would an investor buy a risky stock instead of a safe one?`, [`Because they expect a higher return as a reward for the extra risk`, `Because risky stocks are always cheaper`, `Because risky stocks are guaranteed by the government`, `Because risk lowers the expected return`], `Principle 3: risk requires a reward. Investors only take extra risk if they expect extra return.`),
T(`Agency & ethics`, `Conflicts of interest between managers and owners cause ________ problems. (one word)`, [`agency`], `They are called <b>agency problems</b>. Managers are "agents" hired to work for the owners, but may act in their own interest instead.`),
M(`5 Principles`, `Principle 4 says market prices are generally right. What can still distort prices?`, [`Behavioral biases of investors`, `Public information`, `The time value of money`, `Incremental cash flows`], `Efficient markets reflect public information, but behavioral biases (people being emotional or overconfident) can push prices away from fair value.`),
M(`Agency & ethics`, `Which is a way to REDUCE agency problems?`, [`Paying managers partly in company stock`, `Hiding information from shareholders`, `Banning takeovers of the company`, `Letting managers set their own pay with no oversight`], `Stock-based pay ties managers' wealth to the stock price, so their interests line up with owners'. Monitoring and the threat of takeovers also help.`),
]},
{name:`Drill`, items:[
C(`Ethics + the 3 big decisions`, `<p><b>Ethical behavior</b> = doing the right thing. Unethical decisions can <b>destroy shareholder wealth</b>. Example from class: the <b>Constant Contact</b> CFO hid slowing growth from investors. <b>Trust</b> is the foundation markets run on.</p>
<p>Every company makes 3 big money decisions:</p><ul><li><b>Capital budgeting</b> — which long-term investments to make (factories, machines, projects).</li><li><b>Capital structure</b> — how to pay for them: <b>debt</b> (borrowing) vs <b>equity</b> (selling ownership).</li><li><b>Working capital</b> — managing day-to-day cash.</li></ul>`),
M(`Agency & ethics`, `In the Constant Contact case from class, what did the CFO do wrong?`, [`Hid slowing growth from investors`, `Paid too much in dividends`, `Borrowed too little money`, `Diversified the company's investments`], `The CFO hid slowing growth. Lesson: unethical decisions can destroy shareholder wealth, because markets run on trust.`),
M(`Agency & ethics`, `Why does ethics matter so much in finance?`, [`Markets run on trust — unethical decisions can destroy shareholder wealth`, `Ethical companies never pay taxes`, `Ethics only matters for nonprofits`, `Unethical behavior always raises the stock price`], `Trust is the foundation markets run on. Break it and shareholder wealth can be destroyed.`),
M(`3 Decisions`, `A company decides whether to build a new $50 million factory. Which decision is this?`, [`Capital budgeting`, `Capital structure`, `Working capital`, `Dividend policy`], `Choosing long-term investments (like a factory) = capital budgeting.`),
M(`3 Decisions`, `A company decides to raise money by borrowing (issuing bonds) instead of selling new stock. Which decision is this?`, [`Capital structure`, `Capital budgeting`, `Working capital`, `Triple bottom line`], `Capital structure = the mix of debt vs equity used to finance the firm.`),
M(`3 Decisions`, `Making sure there's enough cash to pay suppliers this month is part of…`, [`Working capital management`, `Capital budgeting`, `Capital structure`, `The triple bottom line`], `Working capital = managing day-to-day cash and short-term items.`),
C(`Forms of business`, `<table class="t"><tr><th>Form</th><th>Liability</th><th>Taxed</th></tr>
<tr><td>Sole proprietorship (1 owner)</td><td>Unlimited</td><td>Once</td></tr>
<tr><td>Partnership</td><td>Unlimited for general partners; limited partners have limited liability but <b>cannot manage</b></td><td>Once</td></tr>
<tr><td>Corporation</td><td>Limited</td><td><b>TWICE</b></td></tr>
<tr><td>S-corporation</td><td>Limited</td><td>Once (under 100 stockholders, one class of stock, US owners only)</td></tr>
<tr><td>LLC</td><td>Limited</td><td>Once (easier to set up)</td></tr></table>
<div class="def"><b>Unlimited liability</b> = the owner's personal stuff (house, savings) can be taken to pay business debts. <b>Limited liability</b> = you can only lose what you invested.</div>
<p>A corporation is a <b>separate legal entity</b> with <b>unlimited life</b>.</p>`),
M(`Business forms`, `Which form of business gives its owner UNLIMITED liability?`, [`Sole proprietorship`, `Corporation`, `LLC`, `S-corporation`], `A sole proprietor has unlimited liability — their personal assets can be used to pay business debts.`),
M(`Business forms`, `Which form of business is taxed TWICE?`, [`Corporation`, `Sole proprietorship`, `LLC`, `S-corporation`], `A (regular) corporation is taxed twice: once on its profits, and again when shareholders pay tax on dividends.`),
M(`Business forms`, `Which is a requirement to be an S-corporation?`, [`Under 100 stockholders, one class of stock, US owners only`, `At least 1,000 stockholders`, `Must be owned by a foreign company`, `Must have unlimited liability`], `S-corps: under 100 stockholders, one class of stock, US owners only. In return: limited liability AND taxed only once.`),
M(`Business forms`, `A limited partner in a partnership…`, [`Has limited liability but cannot manage the business`, `Has unlimited liability and runs the business`, `Pays double taxation`, `Owns the business alone`], `Limited partners get limited liability, but the trade-off is they cannot manage the business.`),
T(`Business forms`, `A corporation is a separate legal ________. (one word)`, [`entity`], `A corporation is a separate legal <b>entity</b> — it exists apart from its owners and has unlimited life.`),
M(`Business forms`, `Which form gives limited liability, is taxed once, and is described as easier to set up?`, [`LLC`, `Corporation`, `Sole proprietorship`, `General partnership`], `The LLC (limited liability company): limited liability, taxed once, easier to set up.`),
]},
{name:`Master`, items:[
C(`Double taxation, step by step`, `<p>A corporation earns $1,000. Corporate tax is 25%. It pays everything left as dividends, and shareholders pay 15% dividend tax.</p>
<div class="formula">Corporate tax = 1,000 × 25% = $250 → left: $750<br>Dividend tax = 750 × 15% = $112.50<br>Total tax = 250 + 112.50 = $362.50<br>Total rate = 362.50 ÷ 1,000 = 36.25%</div>
<p>That's why it's called <b>double</b> taxation: the same earnings get taxed twice.</p>`),
N(`Double taxation`, `A corporation earns $1,000 and pays 25% corporate tax. How much corporate tax does it pay?`, 250, `$`, W([`Corporate tax = earnings × tax rate`, `= 1,000 × 0.25 = $250.00`])),
N(`Double taxation`, `A corporation earns $1,000, pays 25% corporate tax, and pays all that's left as dividends. Shareholders pay 15% dividend tax. What is the TOTAL tax paid?`, 362.50, `$`, W([`Step 1: corporate tax = 1,000 × 0.25 = 250.00`, `Step 2: left for dividends = 1,000 − 250 = 750.00`, `Step 3: dividend tax = 750 × 0.15 = 112.50`, `Step 4: total = 250.00 + 112.50 = $362.50`])),
N(`Double taxation`, `Same example: $1,000 earned, total tax $362.50. What is the total tax RATE (as a %)?`, 36.25, `%`, W([`Total rate = total tax ÷ earnings`, `= 362.50 ÷ 1,000 = 0.3625 = 36.25%`])),
N(`Double taxation`, `Variation: a corporation earns $2,000. 25% corporate tax, then everything left is paid as dividends, taxed at 15%. What is the TOTAL tax?`, 725, `$`, W([`Corporate tax = 2,000 × 0.25 = 500.00`, `Left for dividends = 2,000 − 500 = 1,500.00`, `Dividend tax = 1,500 × 0.15 = 225.00`, `Total = 500.00 + 225.00 = $725.00 (still 36.25% of 2,000)`])),
N(`Double taxation`, `Variation: $2,000 of corporate earnings, 25% corporate tax, everything left paid as dividends taxed at 15%. How much does the shareholder keep after BOTH taxes?`, 1275, `$`, W([`After corporate tax: 2,000 − 500 = 1,500.00`, `Dividend tax: 1,500 × 0.15 = 225.00`, `Kept: 1,500 − 225 = $1,275.00`])),
M(`Business forms`, `Which of these forms is taxed only ONCE?`, [`LLC`, `Corporation`, `Both corporations and LLCs are taxed twice`, `None — every form is taxed twice`], `Sole proprietorships, partnerships, S-corps and LLCs are taxed once. Only the regular corporation is taxed twice.`),
M(`Agency & ethics`, `The CEO spends company money on a luxury corporate jet mostly for personal trips. This is an example of…`, [`An agency problem`, `Capital structure`, `The time value of money`, `An efficient market`], `Managers (agents) acting in their own interest instead of the owners' = an agency problem.`),
D(`Agency & ethics`, `A company switches its managers from a fixed salary to mostly stock-based pay. What happens to the conflict of interest between managers and owners?`, `down`, `It falls. When managers own stock, they win when the stock price rises — the same thing owners want.`),
M(`5 Principles`, `A project shows a big accounting profit but brings in very little actual cash. Which principle warns you about this?`, [`Principle 1: cash flow is what matters`, `Principle 3: risk requires a reward`, `Principle 4: market prices are generally right`, `Principle 5: agency problems`], `Accounting profit is not cash flow. Finance decisions are based on cash.`),
M(`5 Principles`, `Which describes an efficient market?`, [`Prices reflect all public information`, `Prices never change`, `Prices are set by the government`, `Prices ignore company news`], `In an efficient market, prices reflect public information — so they are generally "right".`),
M(`3 Decisions`, `"Should we pay for the new warehouse with a bank loan or by selling more shares?" — which decision?`, [`Capital structure`, `Capital budgeting`, `Working capital`, `Agency`], `HOW you pay (debt vs equity) is capital structure. WHETHER to build it is capital budgeting.`),
M(`Goal of the firm`, `Why does finance focus on the stock PRICE rather than this year's profit?`, [`The stock price reflects the value of all future cash flows, timing and risk`, `Profit is illegal to report`, `The stock price never changes`, `Profit always equals cash flow`], `The price of existing common stock captures what the whole company is worth to its owners — including future cash flows, their timing, and their risk.`),
]},
]});

/* ===================== UNIT 2 — TIME VALUE OF MONEY ===================== */
U({id:2, name:`Time Value of Money`, ch:`Foundations of Finance Ch. 5`, icon:`⏳`, color:`linear-gradient(135deg,#1cb0f6,#1480c4)`, preview:false,
desc:`FV/PV, simple vs compound, compounding frequency, EAR, annuities + annuity due, perpetuities, amortized loans, Excel FV/PV/PMT.`,
lessons:[
{name:`Learn`, items:[
C(`A dollar today > a dollar later`, `<p>Money you have today can earn interest. So $100 today is worth MORE than $100 a year from now. That's the <b>time value of money (TVM)</b>.</p>
<div class="def"><b>PV</b> (present value) = what money is worth today. <b>FV</b> (future value) = what it grows to later. <b>r</b> = interest rate per period. <b>n</b> = number of periods.</div>
<div class="formula">FV = PV × (1 + r)<sup>n</sup></div>
<p><b>Simple interest</b> is paid on the original amount only: I = PV × r × n. <b>Compound interest</b> = earning interest on your interest too.</p>
<p>Always label <b>n, r, PV, FV, PMT</b> before you compute!</p>`),
N(`Compound interest`, `You deposit $100 at 6% interest. What is it worth after 1 year?`, 106, `$`, W([`FV = PV × (1 + r)^n`, `= 100 × (1.06)^1 = $106.00`])),
N(`Compound interest`, `You deposit $100 at 6% compounded annually. What is it worth after 3 years?`, 119.10, `$`, W([`n = 3, r = 6%, PV = 100`, `FV = 100 × (1.06)^3`, `Year 1: 100 × 1.06 = 106.00`, `Year 2: 106.00 × 1.06 = 112.36`, `Year 3: 112.36 × 1.06 = $119.10`])),
N(`Simple vs compound`, `$100 at 6% SIMPLE interest for 3 years. How much interest do you earn in total?`, 18, `$`, W([`Simple interest I = PV × r × n`, `= 100 × 0.06 × 3 = $18.00`, `(Simple interest is paid on the principal only.)`])),
M(`Simple vs compound`, `$100 at 6% compounded for 3 years earns $19.10 total interest. Simple interest would be $18.00. How much of the $19.10 is "interest on interest"?`, [`$1.10`, `$19.10`, `$6.00`, `$18.00`], W([`Compound part = total interest − simple interest`, `= 19.10 − 18.00 = $1.10`])),
C(`Going backward: present value`, `<p>To find what a future amount is worth TODAY, divide instead of multiply. This is called <b>discounting</b>.</p>
<div class="formula">PV = FV ÷ (1 + r)<sup>n</sup></div>
<p>Higher interest rate or more years → <b>lower</b> PV (the future money is worth less today).</p>`),
N(`Compound interest`, `How much must you invest today at 9% (compounded annually) to have $100,000 in 5 years? (Workbook Q2)`, 64993.14, `$`, W([`FV = 100,000, r = 9%, n = 5`, `PV = FV ÷ (1 + r)^n`, `(1.09)^5 = 1.538624`, `PV = 100,000 ÷ 1.538624 = $64,993.14`])),
N(`Compound interest`, `You invest $5,000 at 8% compounded annually for 10 years. What is the future value? (Workbook Q1)`, 10794.62, `$`, W([`PV = 5,000, r = 8%, n = 10`, `FV = 5,000 × (1.08)^10`, `(1.08)^10 = 2.158925`, `FV = 5,000 × 2.158925 = $10,794.62`])),
N(`Compound interest`, `Variation: you deposit $200 at 6% compounded annually for 3 years. What is the future value?`, 238.20, `$`, W([`FV = 200 × (1.06)^3`, `(1.06)^3 = 1.191016`, `FV = 200 × 1.191016 = $238.20`])),
D(`Compound interest`, `You'll receive $1,000 in 5 years. If the interest rate goes UP, what happens to the present value of that $1,000?`, `down`, `It falls. PV = FV ÷ (1 + r)^n — a bigger r makes the bottom bigger, so PV gets smaller.`),
T(`Simple vs compound`, `Earning interest on previously earned interest is called ________ interest.`, [`compound`, `compounded`, `compounding`], `That's <b>compound</b> interest — interest on interest.`),
C(`Compounding more than once a year`, `<p>Banks often compound semiannually (m = 2), quarterly (m = 4), monthly (m = 12), weekly (52) or daily (365).</p>
<div class="def"><b>APR</b> = the quoted annual rate. <b>m</b> = number of compounding periods per year.</div>
<div class="formula">Rate per period = APR ÷ m<br>Number of periods = years × m</div>
<p>More compounding = <b>higher FV</b> and <b>lower PV</b>.</p>`),
N(`Non-annual compounding`, `$100 at 6% APR compounded SEMIANNUALLY for 3 years. What is the future value?`, 119.41, `$`, W([`Rate per period = 6% ÷ 2 = 3%`, `Periods = 3 × 2 = 6`, `FV = 100 × (1.03)^6`, `(1.03)^6 = 1.194052`, `FV = $119.41 (vs $119.10 with annual compounding)`])),
M(`Non-annual compounding`, `A loan has a 12% APR compounded monthly. What is the rate per period?`, [`1% per month`, `12% per month`, `0.12% per month`, `6% per month`], W([`Rate per period = APR ÷ m`, `= 12% ÷ 12 = 1% per month`])),
]},
{name:`Drill`, items:[
M(`Non-annual compounding`, `$1,000 at 9% for 10 years. Annual compounding gives $2,367.36 and quarterly gives $2,435.19. Which compounding gives the HIGHEST future value?`, [`Daily ($2,490.26)`, `Annually ($2,367.36)`, `Semiannually ($2,411.71)`, `Quarterly ($2,435.19)`], `More frequent compounding = interest starts earning interest sooner = higher FV. From class: annual $2,367.36 → semi $2,411.71 → quarterly $2,435.19 → weekly $2,456.71 → daily $2,490.26.`),
D(`Non-annual compounding`, `You need $10,000 in 5 years. Your bank switches from annual to monthly compounding (same APR). What happens to the amount you must deposit today (the PV)?`, `down`, `It falls. More compounding makes money grow faster, so you need to put in less today. More compounding = higher FV, lower PV.`),
C(`EAR: the rate you really earn or pay`, `<div class="def"><b>EAR</b> (effective annual rate) = the rate you ACTUALLY earn or pay in a year once compounding is included. APR is just the quoted rate.</div>
<div class="formula">EAR = (1 + APR/m)<sup>m</sup> − 1</div>
<p>Comparing loans or accounts with different compounding? <b>Always compare EARs.</b> Borrowers pick the <b>lowest</b> EAR; savers pick the <b>highest</b>.</p>`),
N(`EAR`, `What is the EAR of a 7.85% APR compounded quarterly?`, 8.08, `%`, W([`EAR = (1 + APR/m)^m − 1`, `= (1 + 0.0785/4)^4 − 1`, `= (1.019625)^4 − 1`, `= 1.0808 − 1 = 0.0808 = 8.08%`])),
N(`EAR`, `Bank A charges 15% APR compounded DAILY (365 days). What is the EAR?`, 16.18, `%`, W([`EAR = (1 + 0.15/365)^365 − 1`, `0.15/365 = 0.000411`, `(1.000411)^365 = 1.1618`, `EAR = 0.1618 = 16.18%`])),
N(`EAR`, `Bank B charges 15.5% APR compounded QUARTERLY. What is the EAR?`, 16.42, `%`, W([`EAR = (1 + 0.155/4)^4 − 1`, `= (1.03875)^4 − 1`, `= 1.1642 − 1 = 16.42%`])),
M(`EAR`, `You want to BORROW. Bank A: 15% daily (EAR 16.18%). Bank B: 15.5% quarterly (EAR 16.42%). Bank C: 16% compounded annually (EAR 16.00%). Which bank do you pick?`, [`Bank C — lowest EAR (16.00%)`, `Bank A — lowest APR`, `Bank B — highest EAR`, `It doesn't matter, they're all about 15–16%`], `A borrower wants the lowest EFFECTIVE cost. Bank C's EAR is 16.00% — lowest of the three, even though its APR (16%) looks highest!`),
M(`EAR`, `Same three banks, but now you want to SAVE. A: EAR 16.18%. B: EAR 16.42%. C: EAR 16.00%. Which do you pick?`, [`Bank B — highest EAR`, `Bank C — highest APR`, `Bank A — daily compounding`, `Bank C — annual compounding`], `A saver wants the highest effective return: Bank B at 16.42%.`),
N(`EAR`, `Variation: a credit line charges 12% APR compounded MONTHLY. What is the EAR?`, 12.68, `%`, W([`EAR = (1 + 0.12/12)^12 − 1`, `= (1.01)^12 − 1`, `= 1.1268 − 1 = 0.1268 = 12.68%`])),
M(`EAR`, `Workbook Q7: Benes Bank pays 15.1% APR compounded semiannually; Kramer Bank pays 15% APR compounded monthly. On the same deposit, Benes grows to $110,040.10 and Kramer to $110,054.83. Which is better for a saver?`, [`Kramer Bank, by $14.73`, `Benes Bank, because its APR is higher`, `They are identical`, `Benes Bank, by $14.73`], W([`Kramer − Benes = 110,054.83 − 110,040.10 = $14.73`, `Kramer's lower APR still wins because it compounds monthly. Always compare EARs (or FVs), not APRs.`])),
C(`Annuities: equal payments every period`, `<div class="def"><b>Annuity</b> = equal payments (PMT) every period for a set number of periods.</div>
<ul><li><b>Ordinary annuity</b>: payments at the <b>END</b> of each period (car loans, mortgages).</li><li><b>Annuity due</b>: payments at the <b>BEGINNING</b> (rent).</li></ul>
<div class="formula">FV annuity = PMT × [((1 + r)<sup>n</sup> − 1) ÷ r]<br>PV annuity = PMT × [(1 − (1 + r)<sup>−n</sup>) ÷ r]<br>Annuity due = ordinary annuity × (1 + r)</div>`),
N(`Annuities`, `You save $500 at the END of each year for 5 years at 6%. What is the future value?`, 2818.55, `$`, W([`Ordinary annuity: PMT = 500, r = 6%, n = 5`, `FV = 500 × [((1.06)^5 − 1) ÷ 0.06]`, `(1.06)^5 = 1.338226`, `(1.338226 − 1) ÷ 0.06 = 5.637093`, `FV = 500 × 5.637093 = $2,818.55`])),
N(`Annuity due`, `Same deal — $500/year, 5 years, 6% — but you save at the BEGINNING of each year (annuity due). What is the future value?`, 2987.66, `$`, W([`Annuity due = ordinary × (1 + r)`, `Ordinary FV = 2,818.55`, `FV due = 2,818.55 × 1.06 = $2,987.66`])),
N(`Annuities`, `What is the PRESENT value of $500 received at the END of each year for 5 years at 6%?`, 2106.18, `$`, W([`PV = 500 × [(1 − (1.06)^−5) ÷ 0.06]`, `(1.06)^−5 = 0.747258`, `(1 − 0.747258) ÷ 0.06 = 4.212364`, `PV = 500 × 4.212364 = $2,106.18`])),
]},
{name:`Master`, items:[
N(`Annuity due`, `What is the PRESENT value of $500 received at the BEGINNING of each year for 5 years at 6% (annuity due)?`, 2232.55, `$`, W([`Ordinary PV = 2,106.18`, `Annuity due = ordinary × (1 + r)`, `PV due = 2,106.18 × 1.06 = $2,232.55`])),
M(`Annuity due`, `Which payment is usually an annuity DUE (paid at the beginning of each period)?`, [`Rent`, `A car loan payment`, `A mortgage payment`, `A bond coupon`], `Rent is paid at the start of the month → annuity due. Car loans and mortgages are paid at the end → ordinary annuity.`),
M(`Annuities`, `Lottery: take $500,000 today OR $2,850/month for 35 years (420 months) at 6% (0.5%/month). PV of the monthly payments (end of month) = $499,833.64. If paid at the BEGINNING of each month, PV = $502,332.81. Which is right?`, [`End-of-month: take the $500,000 (wins by $166). Beginning-of-month: take the annuity.`, `Always take the annuity`, `Always take the $500,000`, `They are exactly equal either way`], W([`Ordinary: 500,000 − 499,833.64 = $166.36 → cash today wins`, `Annuity due: 502,332.81 > 500,000 → the annuity wins`, `Timing of the payments changes the answer!`])),
C(`Perpetuities, loans and Excel`, `<div class="def"><b>Perpetuity</b> = equal payments that go on forever.</div>
<div class="formula">PV perpetuity = PP ÷ r</div>
<div class="def"><b>Amortized loan</b> = a loan paid off with equal payments. Each payment = some interest + some principal (the amount borrowed).</div>
<div class="formula">PMT = (PV × r) ÷ [1 − (1 + r)<sup>−n</sup>]<br>Interest = beginning balance × r<br>Principal = payment − interest<br>Ending balance = beginning balance − principal</div>
<p>Interest is charged on a shrinking balance, so the <b>interest portion falls</b> and the <b>principal portion rises</b> over time.</p>
<p><b>Excel:</b> =FV(rate,nper,pmt,pv), =PV(rate,nper,pmt,fv), =PMT(rate,nper,pv,fv). Excel answers come out <b>negative</b> (sign convention: money out vs in) — the value is positive.</p>`),
N(`Perpetuities`, `A perpetuity pays $2,000 per year forever. The rate is 10%. What is its present value?`, 20000, `$`, W([`PV = PP ÷ r`, `= 2,000 ÷ 0.10 = $20,000.00`])),
N(`Perpetuities`, `A preferred-style perpetuity pays $1.50 every QUARTER forever. The required return is 12% per year (3% per quarter). What is it worth?`, 50, `$`, W([`Match the rate to the payment period: 12% ÷ 4 = 3% per quarter`, `PV = PP ÷ r = 1.50 ÷ 0.03 = $50.00`])),
N(`Amortized loans`, `You borrow $5,000 at 9%, repaid with 5 equal END-of-year payments. What is the annual payment?`, 1285.46, `$`, W([`PV = 5,000, r = 9%, n = 5`, `PMT = (PV × r) ÷ [1 − (1 + r)^−n]`, `PV × r = 5,000 × 0.09 = 450`, `(1.09)^−5 = 0.649931 → 1 − 0.649931 = 0.350069`, `PMT = 450 ÷ 0.350069 = $1,285.46`])),
N(`Amortized loans`, `Same loan: $5,000 at 9%, payment $1,285.46. How much of the FIRST payment goes to PRINCIPAL?`, 835.46, `$`, W([`Year 1 interest = beginning balance × r = 5,000 × 0.09 = 450.00`, `Principal = payment − interest`, `= 1,285.46 − 450.00 = $835.46`])),
N(`Amortized loans`, `Same loan: $5,000 at 9%, payment $1,285.46, Year-1 principal $835.46. What is the balance at the END of year 1?`, 4164.54, `$`, W([`Ending balance = beginning balance − principal`, `= 5,000.00 − 835.46 = $4,164.54`])),
D(`Amortized loans`, `On an amortized loan, what happens to the INTEREST portion of each payment over time?`, `down`, `It falls. Interest = balance × rate, and the balance shrinks every payment — so the interest part gets smaller and the principal part gets bigger.`),
N(`Amortized loans`, `Mortgage: $300,000 at 9% APR for 15 years, paid MONTHLY. What is the monthly payment?`, 3042.80, `$`, W([`r = 9% ÷ 12 = 0.75% per month; n = 15 × 12 = 180`, `PMT = (300,000 × 0.0075) ÷ [1 − (1.0075)^−180]`, `300,000 × 0.0075 = 2,250`, `(1.0075)^−180 = 0.260549 → 1 − 0.260549 = 0.739451`, `PMT = 2,250 ÷ 0.739451 = $3,042.80`])),
M(`Excel`, `You type =PMT(0.09,5,5000,0) into Excel and get −1,285.46. What does the minus sign mean?`, [`Just Excel's sign convention (money going out) — the payment is $1,285.46`, `You made a mistake; the payment is $0`, `The bank pays YOU $1,285.46`, `The loan has a negative interest rate`], `Excel shows cash you pay out as negative. The value is positive: $1,285.46. The argument order is =PMT(rate, nper, pv, fv).`),
N(`Annuities`, `Retirement: you save $150/week for 38 years (1,976 weeks) at 0.17%/week. FV = $2,442,727.23. You contributed $296,400 in total. How much of the final amount is INTEREST?`, 2146327.23, `$`, W([`Contributions = 150 × 1,976 = 296,400`, `Interest = FV − contributions`, `= 2,442,727.23 − 296,400.00 = $2,146,327.23`, `Most of your retirement money comes from compounding!`])),
]},
]});

/* ===================== UNIT 3 — FINANCIAL PLANNING ===================== */
U({id:3, name:`Financial Planning`, ch:`Personal Finance Ch. 1`, icon:`🗺️`, color:`linear-gradient(135deg,#ff9600,#e07b00)`, preview:false,
desc:`The 5 planning steps, goals, life stages, Social Security, 401(k)/IRA/Roth, insurance types, diversification.`,
lessons:[
{name:`Learn`, items:[
C(`The 5 steps of financial planning`, `<ol><li><b>Evaluate</b> your financial health</li><li><b>Define</b> your goals</li><li><b>Develop</b> a plan</li><li><b>Implement</b> the plan</li><li><b>Review and revise</b></li></ol>
<p>Goal lengths: <b>short-term</b> = under 1 year; <b>intermediate</b> = 1–5 and 5–10 years; <b>long-term</b> = more than 10 years.</p>`),
M(`Planning steps`, `What is STEP 1 of financial planning?`, [`Evaluate your financial health`, `Implement the plan`, `Define your goals`, `Review and revise`], `First you figure out where you stand: evaluate your financial health.`),
M(`Planning steps`, `Which step comes right AFTER "define your goals"?`, [`Develop a plan`, `Evaluate your financial health`, `Review and revise`, `Implement the plan`], `Order: evaluate → define goals → develop a plan → implement → review and revise.`),
T(`Planning steps`, `Step 5 of financial planning is "review and ________".`, [`revise`], `Step 5 = review and <b>revise</b>. Plans change as life changes.`),
M(`Planning steps`, `Saving for a house down payment in 3 years is what kind of goal?`, [`Intermediate-term`, `Short-term`, `Long-term`, `Not a financial goal`], `Intermediate goals are 1–5 (and 5–10) years. Short = under 1 year; long = over 10 years.`),
M(`Planning steps`, `Saving for retirement 40 years away is a…`, [`Long-term goal`, `Short-term goal`, `Intermediate goal`, `Emergency fund`], `More than 10 years away = long-term.`),
C(`Big themes`, `<ul><li>Plan ahead and <b>budget</b>.</li><li><b>"Pay yourself first"</b> = move money into savings BEFORE you spend on anything else.</li><li><b>Save early</b> so compounding has time to work.</li><li>Match investments to your time horizon.</li><li><b>Emergency fund</b> = 3 months of living expenses.</li></ul>`),
M(`Goals & themes`, `How big should an emergency fund be, according to the course?`, [`3 months of living expenses`, `1 week of expenses`, `5 years of salary`, `Whatever is left at the end of the month`], `The course rule: an emergency fund = 3 months of living expenses.`),
N(`Goals & themes`, `Your living expenses are $2,000 per month. Using the course rule, how big should your emergency fund be?`, 6000, `$`, W([`Emergency fund = 3 months × monthly expenses`, `= 3 × 2,000 = $6,000.00`])),
M(`Goals & themes`, `What does "pay yourself first" mean?`, [`Put money into savings before spending on anything else`, `Buy something fun every payday`, `Pay off credit cards last`, `Pay your rent before your taxes`], `Pay yourself first = save first, spend what's left.`),
M(`Goals & themes`, `Saving $200/month for 40 years at 8% grows to about $698,000. Saving $600/month for 20 years at 8% grows to about $353,000. What's the lesson?`, [`Starting early beats saving more later, thanks to compounding`, `Saving more per month always wins`, `Interest rates don't matter`, `Saving is pointless after age 30`], `Less money per month, but double the time → almost twice the result. Time is compounding's best friend.`),
]},
{name:`Drill`, items:[
C(`The 3 life stages`, `<ul><li><b>Stage 1 — Wealth accumulation</b> (before about age 54): save regularly, invest aggressively.</li><li><b>Stage 2 — Approaching retirement</b> (55–64): shift to safer investments; review insurance and estate plans; think about long-term care and Social Security timing.</li><li><b>Stage 3 — Retirement</b>: live off savings with the safest strategy; have a will, trust, power of attorney and health-care proxy.</li></ul>`),
M(`Life stages`, `You're 19. Which life stage are you in, and what's the strategy?`, [`Stage 1 wealth accumulation — save regularly, invest aggressively`, `Stage 2 — move to safer investments`, `Stage 3 — live off savings`, `No stage until you turn 30`], `Before about 54 = wealth accumulation: save regularly and invest aggressively.`),
M(`Life stages`, `Someone aged 60 is in Stage 2 (approaching retirement). What should they generally do?`, [`Move toward safer investments and review insurance/estate plans`, `Invest as aggressively as possible`, `Stop saving completely`, `Cancel all insurance`], `Stage 2 (55–64): safer investments, insurance/estate review, long-term care, Social Security timing.`),
M(`Life stages`, `Which documents are part of Stage 3 (retirement) planning?`, [`Will, trust, power of attorney, health-care proxy`, `Student loan applications`, `A car lease`, `Credit card applications`], `In retirement, estate documents matter: will, trust, power of attorney, health-care proxy.`),
C(`Social Security timing`, `<ul><li>Claim at <b>62</b> → 70% of your full benefit.</li><li>Claim at <b>67</b> (full retirement age) → 100%.</li><li>Each year you delay past full retirement age adds <b>8% per year</b>, until age 70.</li></ul>`),
N(`Social Security`, `Your full Social Security benefit (at 67) would be $2,000/month. How much do you get if you claim at 62?`, 1400, `$`, W([`Claiming at 62 = 70% of full benefit`, `= 2,000 × 0.70 = $1,400.00 per month`])),
N(`Social Security`, `Full benefit at 67 is $2,000/month. You wait until 70 (3 extra years at +8%/year). What is your monthly benefit?`, 2480, `$`, W([`Extra = 3 years × 8% = 24%`, `Benefit = 100% + 24% = 124% of full`, `= 2,000 × 1.24 = $2,480.00 per month`])),
C(`Retirement accounts`, `<table class="t"><tr><th>Account</th><th>Money goes in…</th><th>Growth</th><th>Withdrawals</th></tr>
<tr><td>401(k)</td><td>pre-tax</td><td>tax-deferred</td><td>taxed</td></tr>
<tr><td>Traditional IRA</td><td>pre-tax</td><td>tax-deferred</td><td>taxed (after 59½)</td></tr>

U({id:5, name:`Consumer Loans`, ch:`Personal Finance Ch. 7`, icon:`🏦`, color:`linear-gradient(135deg,#ff4b4b,#d93030)`, preview:false,

lessons:[

<li><b>Secured</b> (backed by <b>collateral</b> = an asset the lender can take if you don't pay → lower rate) vs <b>unsecured</b> (higher rate).</li>

<li><b>Shorter term</b> (lower rate, bigger payments, less total interest) vs <b>longer term</b> (smaller payments, more total interest, usually higher rate).</li></ol>
<div class="def"><b>Maturity</b> = the date the loan ends. <b>Principal</b> = the amount borrowed.</div>`),
M(`Loan decisions`, `A single-payment (balloon) loan means…`, [`You repay principal + interest all at once at maturity`, `You make equal monthly payments`, `You never repay the principal`, `The rate changes every month`], `Single-payment = one big payment of principal + interest at maturity.`),
M(`Loan decisions`, `Why does a secured loan usually have a LOWER rate than an unsecured loan?`, [`It's backed by collateral, so the lender takes less risk`, `Secured loans are always shorter`, `The government pays part of the interest`, `Unsecured loans are tax-deductible`], `Collateral reduces the lender's risk → lower rate.`),

M(`After-tax cost`, `Which kind of interest is tax-deductible, per the course?`, [`Mortgage interest`, `Credit card interest`, `Car loan interest`, `Payday loan fees`], `Mortgage interest is deductible; other consumer interest generally is not.`),
]},
{name:`Master`, items:[
C(`Expensive borrowing to avoid`, `<p><b>Payday loans</b>: e.g. borrow $350, repay $400 in 14 days.</p>
<div class="formula">14-day rate = 50 ÷ 350 = 14.29%<br>Annualized = 14.29% × (365 ÷ 14) ≈ 373% (can reach 400%)</div>
<p><b>Buy now, pay later</b> (Klarna, Affirm, Afterpay): advertised as interest-free, but the true cost can reach <b>36%</b> plus late fees.</p>`),
N(`Payday & BNPL`, `A payday loan: borrow $350, repay $400 in 14 days. What is the 14-day interest rate (as a %)?`, 14.29, `%`, W([`Cost = 400 − 350 = 50`, `14-day rate = 50 ÷ 350 = 0.1429 = 14.29%`])),
N(`Payday & BNPL`, `That payday loan costs 14.29% for 14 days. What is the ANNUALIZED rate (as a %)? (365-day year)`, 372.45, `%`, W([`Periods per year = 365 ÷ 14 = 26.07`, `Annualized = (50 ÷ 350) × (365 ÷ 14)`, `= 0.142857 × 26.0714 = 3.7245 = 372.45%`, `≈ 373% on the slides (they multiply the rounded 14.29%)`]), 0.01),
M(`Payday & BNPL`, `Buy-now-pay-later plans (Klarna, Affirm, Afterpay) are advertised as interest-free. What can their true cost reach?`, [`Up to 36% plus late fees`, `Always exactly 0%`, `About 1%`, `400% every time`], `Per the slides: the true cost can reach 36% plus late fees.`),
C(`Home equity + where to borrow`, `<div class="def"><b>Equity</b> in a home = market value − loan balance.</div>
<p><b>Home equity loan</b>: secured by your home equity; interest is deductible; but your <b>home is at risk</b> if you don't pay.</p>
<p><b>Cheapest sources</b>: family, home equity, cash-value life insurance. <b>Most expensive</b>: retail stores, finance companies, small-loan companies.</p>
<p><b>Keys to the best rate</b>: strong credit, collateral, shorter term, large down payment, variable rate.</p>`),
N(`Loan sources`, `Your home's market value is $400,000 and your mortgage balance is $250,000. How much equity do you have?`, 150000, `$`, W([`Equity = market value − loan balance`, `= 400,000 − 250,000 = $150,000.00`])),
M(`Loan sources`, `What is the big RISK of a home equity loan?`, [`Your home is at risk if you can't repay`, `The interest is never deductible`, `It has the highest rate of any loan`, `It must be repaid in 14 days`], `It's secured by your home — miss payments and you could lose it.`),
M(`Loan sources`, `Which are among the CHEAPEST sources of borrowing?`, [`Family, home equity, cash-value life insurance`, `Retail stores and finance companies`, `Payday lenders`, `Small-loan companies`], `Cheapest: family, home equity, cash-value life insurance. Most expensive: retail stores, finance companies, small-loan companies.`),
M(`Loan sources`, `Which is NOT one of the keys to getting the best loan rate?`, [`Choosing a longer term`, `Strong credit`, `Offering collateral`, `A large down payment`], `Keys: strong credit, collateral, SHORTER term, large down payment, variable rate. A longer term usually means a higher rate.`),
C(`Student loans`, `<ul><li>Apply for <b>federal aid first</b>; then grants and scholarships (free money).</li><li><b>American Opportunity Tax Credit</b>: up to <b>$2,500/yr</b> for the first 4 years.</li><li>Repayment plans: <b>standard 10-year</b>, extended up to 30 years, income-based, graduated.</li><li><b>Deferment</b> (up to 3 yrs): no interest on <b>subsidized</b> loans. <b>Forbearance</b>: interest keeps <b>accruing</b> (building up).</li></ul>`),
M(`Student loans`, `What is the American Opportunity Tax Credit worth?`, [`Up to $2,500 per year for the first 4 years`, `Up to $250 per year forever`, `$10,000 once`, `Nothing — it's a loan`], `AOTC: up to $2,500/yr, first 4 years.`),
M(`Student loans`, `What's the difference between deferment and forbearance?`, [`Deferment: no interest on subsidized loans. Forbearance: interest keeps accruing.`, `They are exactly the same`, `Forbearance cancels the loan`, `Deferment doubles the interest rate`], `During deferment (up to 3 years) subsidized loans don't accrue interest. During forbearance, interest accrues.`),
M(`Student loans`, `What is the "standard" student loan repayment period?`, [`10 years`, `30 years`, `14 days`, `1 year`], `Standard = 10 years. Extended can go to 30; there are also income-based and graduated plans.`),
]},
]});

/* ===================== UNIT 6 — CARS & HOMES ===================== */
U({id:6, name:`Cars & Homes`, ch:`Personal Finance Ch. 8`, icon:`🏠`, color:`linear-gradient(135deg,#00cd9c,#00a37c)`, preview:false,
desc:`Smart buying, total cost of ownership, leasing, home closing costs, PITI, fixed vs ARM mortgages, 15- vs 30-year loans.`,
lessons:[
{name:`Learn`, items:[
C(`Buying a car smartly: 4 steps`, `<ol><li><b>Separate want from need.</b></li><li><b>Do your homework</b>: affordability, comparison shopping, operating costs.</li><li><b>Purchase</b>: know the <b>invoice price</b> (what the dealer paid), the <b>dealer holdback</b> (2–3% the manufacturer gives back to the dealer), negotiate, get the <b>"out the door" price</b> (the full final price), and keep financing OUT of the price negotiation.</li><li><b>Maintain</b>: use the warranty first; <b>lemon laws</b> protect you if a new car has repeated defects.</li></ol>`),
M(`Smart buying`, `What is the FIRST step in smart buying?`, [`Separate want from need`, `Negotiate the price`, `Sign up for financing`, `Buy an extended warranty`], `Step 1: separate want from need. Then homework → purchase → maintain.`),
M(`Smart buying`, `The dealer holdback is…`, [`2–3% the manufacturer pays back to the dealer`, `The down payment you make`, `A fee you pay to hold the car`, `The sales tax`], `Holdback = 2–3% returned to the dealer by the manufacturer — so the dealer can sell near invoice and still profit.`),
M(`Smart buying`, `Why should you keep financing OUT of the price negotiation?`, [`So the dealer can't hide profit by shifting it between price and loan terms`, `Because financing is always free`, `Because you can't finance a car`, `To get a longer loan`], `Negotiate the "out the door" price first. Mixing in financing lets the dealer move profit around.`),
M(`Smart buying`, `What does the "out the door" price mean?`, [`The full final price you actually pay`, `The sticker price only`, `The invoice price`, `The monthly payment`], `"Out the door" = everything included — the real final number.`),
M(`Smart buying`, `What protects you if your new car has repeated serious defects?`, [`Lemon laws`, `Dealer holdback`, `An open-end lease`, `PMI`], `Lemon laws.`),
C(`Total cost of ownership`, `<p>The price tag is just the start. Total cost of ownership includes: <b>gas</b> (figure 15,000 miles/yr), <b>maintenance, insurance, repairs, financing, state fees</b>, and <b>depreciation</b> (the car losing value) — usually the <b>biggest hidden cost</b>.</p>
<p>Dealers profit from: new cars (gross margin only ~3.9%), used cars, financing, warranties, service/parts, holdback and add-ons. <b>Watch out for extended warranties and add-ons.</b></p>`),
M(`Total cost of ownership`, `What is usually the BIGGEST hidden cost of owning a car?`, [`Depreciation`, `State fees`, `Car washes`, `Parking`], `Depreciation — the car losing value — is usually the biggest hidden cost.`),
M(`Total cost of ownership`, `How many miles per year does the course use to estimate gas costs?`, [`15,000`, `1,500`, `50,000`, `5,000`], `15,000 miles per year.`),
M(`Total cost of ownership`, `A dealer's gross profit on a NEW car is only about 3.9%. Where else do dealers make money?`, [`Financing, warranties, service/parts, holdback and add-ons`, `Nowhere else`, `Only from used-car trade-ins being free`, `From your insurance company`], `New-car margins are thin, so dealers push financing, extended warranties and add-ons. Watch those.`),
T(`Total cost of ownership`, `The loss in a car's value over time is called ________.`, [`depreciation`], `That's <b>depreciation</b> — usually the biggest hidden cost of owning a car.`),
]},
{name:`Drill`, items:[
C(`Leasing`, `<div class="def"><b>Lease</b> = paying to use a car for a set time, then giving it back.</div>
<ul><li><b>Closed-end lease</b> ("walk-away"): the <b>lessor</b> (leasing company) bears the risk that the car loses more value than expected.</li><li><b>Open-end lease</b>: the <b>lessee</b> (you) pays if the car is worth less than expected.</li></ul>
<p>Leasing can make sense if: closed-end, you want a new car every 2–4 years, you drive under 15,000 miles/yr, you take good care of the car, and you accept endless payments.</p>`),
M(`Leasing`, `In a CLOSED-end lease, who bears the risk if the car loses more value than expected?`, [`The lessor (leasing company)`, `The lessee (you)`, `The government`, `Your insurance company`], `Closed-end = walk-away: the lessor bears the excess-depreciation risk.`),
M(`Leasing`, `In an OPEN-end lease, who pays if the car is worth less than expected at the end?`, [`The lessee (you)`, `The lessor`, `The car manufacturer`, `Nobody`], `Open-end: the lessee pays.`),
M(`Leasing`, `Leasing can make sense if you…`, [`Want a new car every 2–4 years and drive under 15,000 miles/yr`, `Drive 40,000 miles a year`, `Want to own the car forever`, `Want an open-end lease`], `Closed-end lease, new car every 2–4 yrs, under 15,000 miles/yr, good care, accept endless payments.`),
C(`One-time home-buying costs`, `<ul><li><b>Down payment</b>: 20% is typical. Under 20% usually requires <b>PMI</b> (private mortgage insurance) costing 0.3–1.5% of the loan.</li><li><b>Points</b>: discount points = a % of the loan paid up front.</li><li>Fees: origination, application, appraisal, title, attorney, inspection, escrow.</li></ul>`),
N(`Home buying costs`, `You buy a $300,000 home with the typical 20% down payment. How much is the down payment?`, 60000, `$`, W([`Down payment = price × 20%`, `= 300,000 × 0.20 = $60,000.00`])),
M(`Home buying costs`, `When do you usually have to pay PMI?`, [`When your down payment is under 20%`, `When you put 20% or more down`, `Only on 15-year loans`, `When you rent`], `Under 20% down usually requires PMI (0.3–1.5% of the loan).`),
M(`Home buying costs`, `"Discount points" on a mortgage are…`, [`A percentage of the loan paid up front`, `Credit card rewards`, `The appraisal fee`, `Your FICO score`], `Discount points = % of the loan paid at closing.`),
C(`PITI: the real monthly cost`, `<div class="formula">PITI = Principal + Interest + Taxes + Insurance</div>
<p>Plus <b>maintenance and repairs</b>. "Monthly housing cost" questions want <b>PITI + maintenance</b>, NOT just the mortgage payment.</p>`),
M(`PITI`, `What does PITI stand for?`, [`Principal, interest, taxes, insurance`, `Payment, income, tax, interest`, `Price, inspection, title, insurance`, `Principal, inflation, term, interest`], `PITI = principal + interest + taxes + insurance.`),
N(`PITI`, `Monthly principal + interest = $1,200, property taxes = $300/month, homeowner's insurance = $100/month, maintenance = $150/month. What is the total monthly HOUSING cost?`, 1750, `$`, W([`PITI = 1,200 + 300 + 100 = 1,600`, `Housing cost = PITI + maintenance`, `= 1,600 + 150 = $1,750.00`])),
M(`PITI`, `A question asks for the "monthly housing cost." What should you include?`, [`PITI plus maintenance`, `Only the mortgage payment`, `Only taxes`, `Only the down payment`], `Monthly housing cost = PITI + maintenance (and repairs).`),
M(`Home buying costs`, `Which is NOT a typical one-time home-buying cost?`, [`Monthly property taxes`, `Appraisal fee`, `Title fee`, `Home inspection`], `Property taxes are ongoing (part of PITI). Appraisal, title, inspection are one-time closing costs.`),
]},
{name:`Master`, items:[
C(`Mortgage types + rent vs buy`, `<ul><li><b>Fixed-rate</b>: payment never changes; prepayment privilege; assumable loans are rare.</li><li><b>ARM</b> (adjustable-rate mortgage): rate floats with an <b>index + margin</b>; starts with a <b>teaser</b> intro rate; has adjustment intervals; <b>per-adjustment and lifetime caps</b>; payments usually <b>rise at reset</b>.</li><li><b>Balloon</b>: small payments for 5–7 years, then the whole loan is due.</li><li><b>Interest-only</b>: interest only for a set period, then principal + interest.</li></ul>
<p><b>Renting</b>: flexibility, no maintenance. <b>Buying</b>: build equity, stable fixed-rate payments, can sell and move.</p>`),
M(`Mortgage types`, `Which mortgage's payment NEVER changes?`, [`Fixed-rate`, `ARM`, `Balloon`, `Interest-only`], `Fixed-rate: same payment for the life of the loan.`),
M(`Mortgage types`, `An ARM's rate is set by…`, [`An index plus a margin`, `The borrower's choice each year`, `The home's price`, `Nothing — it's fixed`], `ARM rate = index + margin, with caps per adjustment and over the loan's life.`),
D(`Mortgage types`, `An ARM's teaser rate ends and the loan resets. What usually happens to the monthly payment?`, `up`, `Payments usually rise at reset (the teaser rate was below the index + margin rate).`),
M(`Mortgage types`, `Which mortgage has small payments for 5–7 years, then the WHOLE loan comes due?`, [`Balloon mortgage`, `Fixed-rate mortgage`, `Interest-only mortgage`, `15-year mortgage`], `Balloon: small payments for 5–7 years, then everything is due.`),
M(`Mortgage types`, `An interest-only mortgage means…`, [`You pay only interest for a set period, then principal + interest`, `You never pay interest`, `The bank pays your interest`, `You only pay principal`], `Interest-only for a period, then principal + interest kicks in (higher payments).`),
M(`Rent vs buy`, `Which is an advantage of BUYING over renting?`, [`You build equity`, `No maintenance`, `Maximum flexibility to move`, `No property taxes`], `Buying builds equity and gives stable fixed-rate payments. Renting gives flexibility and no maintenance.`),
C(`Insurance + mortgage term`, `<div class="def"><b>Deductible</b> = what you pay before insurance pays. <b>Higher deductible = lower premium.</b> <b>Umbrella insurance</b> covers liability beyond your home/auto/boat policy limits.</div>
<table class="t"><tr><th>$100,000 at 5%</th><th>Monthly</th><th>Total interest</th></tr><tr><td>10 yr</td><td>$1,060.66</td><td>$27,278.62</td></tr><tr><td>15 yr</td><td>$790.80</td><td>$42,342.85</td></tr><tr><td>20 yr</td><td>$659.96</td><td>$58,389.36</td></tr><tr><td>30 yr</td><td>$536.82</td><td>$93,255.78</td></tr></table>
<p>Halving the term roughly doubles the payment but cuts total interest by more than two-thirds.</p>`),
D(`Insurance deductibles`, `You raise your car insurance deductible from $500 to $1,000. What happens to your premium?`, `down`, `It falls. You're taking on more of the risk yourself, so insurance costs less.`),
M(`Insurance deductibles`, `What does umbrella insurance do?`, [`Covers liability beyond your home/auto/boat policy limits`, `Covers rain damage only`, `Replaces your income`, `Pays your mortgage`], `Umbrella insurance = extra coverage beyond your other policies' limits.`),
N(`Mortgage term`, `$100,000 at 5%: total interest is $93,255.78 on a 30-year loan and $42,342.85 on a 15-year loan. How much interest do you SAVE with the 15-year?`, 50912.93, `$`, W([`Savings = 93,255.78 − 42,342.85 = $50,912.93`])),
D(`Mortgage term`, `You switch a $100,000, 5% mortgage from 15 years to 30 years. What happens to the MONTHLY payment?`, `down`, `It falls: from $790.80 to $536.82. But total interest jumps from $42,342.85 to $93,255.78.`),
M(`Mortgage term`, `$100,000 at 5%: 30-yr payment $536.82 (interest $93,255.78) vs 15-yr $790.80 (interest $42,342.85). The pattern?`, [`Halving the term raises the payment but cuts total interest by more than half`, `Shorter terms always cost more interest`, `The payment is the same either way`, `Longer terms save interest`], `Shorter term = bigger payment, MUCH less total interest.`),
]},
]});

/* ===================== UNIT 7 — FINANCIAL STATEMENTS ===================== */
U({id:7, name:`Financial Statements`, ch:`Foundations of Finance Ch. 3`, icon:`📑`, color:`linear-gradient(135deg,#2b70c9,#1d4f94)`, preview:false,
desc:`Income statement, common-size, depreciation tax shield, balance sheet (A = L + E), NWC and transactions, cash flow statement, NOWC.`,
lessons:[
{name:`Learn`, items:[
C(`The income statement (covers a PERIOD)`, `<div class="formula">Revenue<br>− COGS (cost of goods sold) = Gross Profit<br>− Operating expenses (R&amp;D, sales &amp; marketing, G&amp;A incl. depreciation) = Operating Profit (EBIT)<br>− Interest = Profit Before Taxes<br>− Taxes = Net Income</div>
<div class="def"><b>Top line</b> = revenue (sales). <b>Bottom line</b> = net income. <b>EBIT</b> = earnings before interest and taxes. <b>EPS</b> = net income ÷ shares outstanding.</div>
<p>Net income is either paid out as <b>dividends</b> or <b>retained</b> (kept) in the business.</p>`),
N(`Income statement`, `Revenue = $5,000, COGS = $1,000. What is gross profit?`, 4000, `$`, W([`Gross profit = revenue − COGS`, `= 5,000 − 1,000 = $4,000.00`])),
N(`Income statement`, `Gross profit = $4,000. Operating expenses: R&D $1,000 + sales & marketing $1,500 + G&A $400. What is operating profit (EBIT)?`, 1100, `$`, W([`Operating expenses = 1,000 + 1,500 + 400 = 2,900`, `EBIT = gross profit − operating expenses`, `= 4,000 − 2,900 = $1,100.00`])),
N(`Income statement`, `EBIT = $1,100, interest = $100, tax rate 40%. What is net income?`, 600, `$`, W([`Profit before taxes = 1,100 − 100 = 1,000`, `Taxes = 1,000 × 0.40 = 400`, `Net income = 1,000 − 400 = $600.00`])),
N(`Income statement`, `Net income = $600 and there are 100 shares outstanding. What is EPS?`, 6, `$`, W([`EPS = net income ÷ shares outstanding`, `= 600 ÷ 100 = $6.00`])),
M(`Income statement`, `What are the "top line" and "bottom line"?`, [`Revenue and net income`, `Assets and liabilities`, `Cash and debt`, `EBIT and taxes`], `Top line = revenue; bottom line = net income.`),
M(`Income statement`, `An income statement shows…`, [`Results over a PERIOD of time`, `A snapshot on ONE date`, `Only cash`, `Only the stock price`], `Income statement = a period (like a year). Balance sheet = one date.`),
C(`Common-size statements & margins`, `<p>A <b>common-sized</b> income statement shows every line as a % of sales. Class company (2022): COGS 20.0%, gross profit 80.0%, operating profit 20.0%, net income 12.0%.</p>
<div class="formula">Gross margin = gross profit ÷ revenue<br>Operating margin = operating profit ÷ revenue<br>Net margin = net income ÷ revenue</div>`),
N(`Common-size & margins`, `Revenue $5,000, gross profit $4,000. What is the gross margin (as a %)?`, 80, `%`, W([`Gross margin = gross profit ÷ revenue`, `= 4,000 ÷ 5,000 = 0.80 = 80.00%`])),
N(`Common-size & margins`, `Revenue $5,000, net income $600. What is the net margin (as a %)?`, 12, `%`, W([`Net margin = net income ÷ revenue`, `= 600 ÷ 5,000 = 0.12 = 12.00%`])),
C(`The depreciation tax shield`, `<div class="def"><b>Depreciation</b> = spreading the cost of a long-lived asset (like a machine) over its useful life as an expense.</div>
<p>Buying a machine is NOT tax-deductible. <b>Depreciating it IS.</b> Depreciation is <b>non-cash</b>: it reduces profit (and taxes), not cash.</p>
<div class="formula">Straight-line depreciation = cost ÷ life<br>Tax saving (tax shield) = depreciation × tax rate</div>
<p>Machine $100,000, 4-year life, 20% tax: depreciation $25,000/yr → tax saving $5,000/yr.</p>`),
N(`Depreciation tax shield`, `A machine costs $100,000 and has a 4-year life (straight-line). What is the annual depreciation?`, 25000, `$`, W([`Depreciation = cost ÷ life`, `= 100,000 ÷ 4 = $25,000.00 per year`])),
N(`Depreciation tax shield`, `Depreciation is $25,000/yr and the tax rate is 20%. How much tax does depreciation save each year?`, 5000, `$`, W([`Tax shield = depreciation × tax rate`, `= 25,000 × 0.20 = $5,000.00 per year`])),
N(`Depreciation tax shield`, `Variation: a machine costs $80,000, 4-year life (straight-line), tax rate 25%. What is the annual tax saving from depreciation?`, 5000, `$`, W([`Depreciation = 80,000 ÷ 4 = 20,000`, `Tax shield = 20,000 × 0.25 = $5,000.00 per year`])),
]},
{name:`Drill`, items:[
C(`The balance sheet (ONE date)`, `<div class="formula">Assets = Liabilities + Equity   (it MUST balance)</div>
<ul><li><b>Current assets</b> (become cash within 12 months): cash, receivables, inventory, prepaid. <b>Long-term assets</b>: fixed assets (PP&amp;E = property, plant &amp; equipment), intangibles (patents, goodwill), long-term investments.</li>
<li><b>Current liabilities</b>: payables, accrued expenses, short-term debt, deferred revenue. <b>Long-term liabilities</b>: long-term debt, pensions, deferred revenue.</li>
<li><b>Equity</b>: common stock + APIC (additional paid-in capital), preferred stock, <b>retained earnings</b> (ALL past net income minus ALL dividends — <b>NOT cash</b>), less <b>treasury stock</b> (shares bought back — shown as a negative).</li></ul>
<div class="def"><b>Receivables</b> = money customers owe you. <b>Payables</b> = money you owe suppliers. <b>Deferred revenue</b> = cash received for work not done yet.</div>
<p><b>Book value</b> = recorded at cost; <b>market value</b> = what it's worth today. SunTrust's Coca-Cola stake: book value $69,295 for 93 years; market value $1.7 billion!</p>`),
N(`Balance sheet`, `A company has total liabilities of $6,000 and equity of $4,000. What are its total assets?`, 10000, `$`, W([`Assets = liabilities + equity`, `= 6,000 + 4,000 = $10,000.00`])),
M(`Balance sheet`, `Retained earnings are…`, [`All past net income minus all dividends — NOT a pile of cash`, `The company's cash in the bank`, `Money owed to suppliers`, `This year's revenue`], `Retained earnings = cumulative net income − cumulative dividends. It's an accounting total, not cash.`),
M(`Balance sheet`, `Where does inventory go on the balance sheet?`, [`Current assets`, `Long-term assets`, `Current liabilities`, `Equity`], `Inventory should turn into cash within 12 months → current asset.`),
M(`Balance sheet`, `Deferred revenue (cash received before doing the work) is a…`, [`Liability`, `Asset`, `Part of equity`, `Expense`], `You owe the customer the work — so it's a liability.`),
M(`Balance sheet`, `Treasury stock (shares the company bought back) appears in equity as…`, [`A negative (it reduces equity)`, `A positive asset`, `A current liability`, `Revenue`], `Treasury stock is subtracted from equity.`),
M(`Balance sheet`, `SunTrust's Coca-Cola stake had a book value of $69,295 but a market value of $1.7 billion. Why so different?`, [`Book value is recorded at historical cost; market value is today's worth`, `Book value includes inflation`, `Market value is always lower`, `It's an accounting error`], `Book value = original cost. Market value = what it's worth now. Over 93 years they drifted far apart.`),
N(`Balance sheet`, `Total liabilities = $6,000 and total assets = $10,000. What is the debt ratio (as a %)?`, 60, `%`, W([`Debt ratio = total liabilities ÷ total assets`, `= 6,000 ÷ 10,000 = 0.60 = 60.00%`])),
C(`Net working capital (NWC)`, `<div class="formula">NWC = Current Assets − Current Liabilities</div>
<p>Class balance sheet: current assets $6,500 (cash $1,000 + receivables $3,000 + inventory $2,000 + other $500); current liabilities $3,500 (payables $2,000 + other $1,500). NWC = $3,000.</p>
<p>Positive NWC helps pay bills but earns low returns. <b>Rising NWC is not always good</b>: rising receivables can mean customers aren't paying; rising inventory can mean products aren't selling.</p>`),
N(`Net working capital`, `Current assets = $6,500 and current liabilities = $3,500. What is NWC?`, 3000, `$`, W([`NWC = CA − CL`, `= 6,500 − 3,500 = $3,000.00`])),
N(`Net working capital`, `Chipotle (Mar 31, 2025, in thousands): current assets $1,661,648, current liabilities $1,091,538. What is NWC (in thousands)?`, 570110, `$`, W([`NWC = CA − CL`, `= 1,661,648 − 1,091,538 = $570,110 (thousands)`])),
M(`Net working capital`, `NWC rose because accounts receivable jumped. Is that automatically good?`, [`No — it may mean customers aren't paying`, `Yes, higher NWC is always good`, `Yes, receivables are cash`, `No — NWC can never rise`], `Rising NWC isn't always good. Rising receivables = customers not paying; rising inventory = products not selling.`),
C(`Valuing a small business (Oct 5 lecture)`, `<p>Professor Fogel: small private businesses are often valued at about <b>3× the owner's annual share</b> (a three-year payback). Cash position can matter more than reported profit. Example: a massage shop with three co-owners, each taking a share — valued by an owner-share multiple.</p>`),
N(`Small business valuation`, `Using the ~3× rule from the Oct 5 lecture, an owner takes home $50,000 a year from a small private business. Roughly what is their stake worth?`, 150000, `$`, W([`Value ≈ 3 × owner's annual share`, `= 3 × 50,000 = $150,000.00 (a three-year payback)`])),
]},
{name:`Master`, items:[
C(`How transactions move NWC`, `<p>Ask two questions: does it change <b>current assets</b>? Does it change <b>current liabilities</b>? NWC = CA − CL.</p><p>Example: buy inventory on credit → inventory (CA) up AND payables (CL) up by the same amount → NWC unchanged.</p>`),
D(`NWC transactions`, `You provide services to a customer ON CREDIT (they'll pay later). What happens to NWC?`, `up`, `Receivables (a current asset) rise, no liability changes → NWC rises. Cash is unchanged.`),
D(`NWC transactions`, `You COLLECT a receivable (the customer pays you). What happens to NWC?`, `same`, `Cash up, receivables down by the same amount — both are current assets → NWC unchanged (but cash rises).`),
D(`NWC transactions`, `You buy inventory ON CREDIT. What happens to NWC?`, `same`, `Inventory (CA) up and payables (CL) up by the same amount → NWC unchanged.`),
D(`NWC transactions`, `You buy a MACHINE on credit (short-term payable). What happens to NWC?`, `down`, `The machine is a long-term asset, not current. Payables (CL) rise → NWC falls.`),
D(`NWC transactions`, `You PAY a supplier invoice (accounts payable) with cash. What happens to NWC?`, `same`, `Cash (CA) down and payables (CL) down by the same amount → NWC unchanged. Cash falls.`),
D(`NWC transactions`, `The company issues LONG-TERM debt and receives cash. What happens to NWC?`, `up`, `Cash (CA) rises; the new debt is long-term, not current → NWC rises.`),
C(`The cash flow statement (covers a PERIOD)`, `<p>Usually the <b>indirect method</b>: start with net income, add back non-cash expenses (depreciation), adjust for working-capital changes.</p>
<ul><li><b>Operating</b>: the core business. <b>Investing</b>: long-term assets/securities. <b>Financing</b>: debt/equity, dividends, buybacks.</li><li><b>Sources of cash</b>: decreases in assets, increases in liabilities. <b>Uses of cash</b>: increases in assets, decreases in liabilities.</li></ul>
<div class="formula">NOWC = (receivables + inventory + prepaid) − (payables + accrued expenses + deferred revenue)<br>Free cash flow = operating cash flow − capital expenditures</div>
<p>NOWC (net operating working capital) excludes cash and interest-bearing debt. Increase in NOWC = <b>USE</b> of cash; decrease = <b>SOURCE</b>.</p>`),
N(`Cash flow statement`, `Net income $600, depreciation $400, receivables increased $300, payables increased $200. What is operating cash flow?`, 900, `$`, W([`Start: net income = 600`, `+ depreciation (non-cash) = +400`, `− increase in receivables (asset up = use) = −300`, `+ increase in payables (liability up = source) = +200`, `OCF = 600 + 400 − 300 + 200 = $900.00`])),
N(`Cash flow statement`, `Operating cash flow +$900, investing (fixed asset purchases) −$400, financing (debt repayments −$100, dividends −$150). What is the total change in cash?`, 250, `$`, W([`Financing = −100 − 150 = −250`, `Total = 900 − 400 − 250 = +$250.00`])),
M(`Cash flow statement`, `An INCREASE in an asset (like inventory) is a…`, [`Use of cash`, `Source of cash`, `Non-cash item`, `Financing inflow`], `Assets up = you spent cash = use. Liabilities up = you kept/borrowed cash = source.`),
D(`NOWC`, `A company's NOWC increases by $50,000 this year. What does that do to its cash flow?`, `down`, `An increase in NOWC is a USE of cash — cash flow falls.`),
M(`NOWC`, `Which items are EXCLUDED from NOWC?`, [`Cash and interest-bearing debt`, `Receivables and inventory`, `Payables and accrued expenses`, `Deferred revenue and prepaid`], `NOWC excludes cash and interest-bearing debt.`),
N(`Cash flow statement`, `Operating cash flow = $900 and capital expenditures = $400. What is free cash flow?`, 500, `$`, W([`FCF = operating cash flow − capital expenditures`, `= 900 − 400 = $500.00`])),
M(`Depreciation tax shield`, `Why do we ADD BACK depreciation when computing operating cash flow?`, [`It reduced net income but didn't use any cash`, `It is a source of revenue`, `It's a financing inflow`, `Because taxes are added back`], `Depreciation is non-cash — it lowered profit without any cash leaving.`),
]},
]});

<p>ROE uses <b>NET</b> income — after interest and taxes.</p>

C(`Transaction effects: recompute, never guess`, `<p>Rebuild the ratio from the NEW balance sheet. Key rules:</p><ul>
<li><b>Equal-dollar shrink rule</b>: if a ratio is <b>above 1</b>, shrinking both top and bottom by the same $ RAISES it; if <b>below 1</b>, it LOWERS it.</li>
<li>Buying inventory on credit adds the same $ to CA and CL → pushes the current ratio <b>toward 1</b>.</li>
<li>Collecting a receivable: no ratio change (cash up, AR down).</li>
<li>Issuing long-term debt for cash: current ratio rises, debt ratio rises.</li>
<li>Paying a dividend with cash: current ratio falls, debt ratio rises, ROE rises (smaller equity base).</li>
<li>Selling stock for cash: debt ratio falls.</li></ul>`),
